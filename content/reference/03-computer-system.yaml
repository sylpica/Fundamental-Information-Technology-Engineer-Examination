id: ref-computer-system
title: コンピュータ構成要素・システム構成要素
categories: ['3', '4']
sections:
  - title: CPU の構成と性能
    body: |
      CPU は**制御装置**（命令の解読・各装置への指示）と**演算装置**（ALU）、およびレジスタから構成されます。プログラムカウンタは次に実行する命令のアドレスを、命令レジスタは実行中の命令を保持します。

      命令の実行は「命令フェッチ → 解読 → オペランドのアドレス計算 → オペランド読出し → 実行」の順に進みます。

      **性能指標**：
      - CPI：1命令あたりの平均クロック数
      - MIPS：1秒間に実行できる命令数（百万単位）
      - 1命令の平均実行時間＝CPI÷クロック周波数

      例：クロック 2GHz、CPI 4 なら 1命令は 4÷(2×10⁹)＝2ナノ秒、性能は 500MIPS です。

      **試験でのポイント**：命令ミックスは「各命令の実行時間×出現率」の総和で平均実行時間を求めます。
  - title: 高速化技術
    body: |
      **パイプライン**は命令の各段階を重ねて並列に処理します。k 段のパイプラインで n 命令を実行するのに要するサイクル数は、乱れがなければ k＋(n−1) です。

      パイプラインを乱す要因（ハザード）には、分岐命令による制御ハザード、データの依存によるデータハザード、資源の競合による構造ハザードがあります。分岐予測や投機実行で影響を緩和します。

      その他の方式：
      - スーパースカラ：複数のパイプラインで同時に複数命令を実行
      - スーパーパイプライン：パイプラインの段数を細かく増やす
      - VLIW：複数の命令を1つの長い命令語にまとめて同時実行
      - マルチコア：1つのチップに複数の CPU コアを搭載

      **試験でのポイント**：パイプラインのサイクル数計算は頻出です。
  - title: 記憶階層とキャッシュメモリ
    body: |
      記憶装置は高速・小容量・高価なものから順に「レジスタ → キャッシュ → 主記憶 → 補助記憶」の階層を構成します。

      | メモリ | 特徴 | 用途 |
      |---|---|---|
      | SRAM | フリップフロップ。高速、リフレッシュ不要 | キャッシュ |
      | DRAM | コンデンサ。安価・大容量、リフレッシュ必要 | 主記憶 |
      | フラッシュメモリ | 不揮発、電気的に書換え可能 | SSD・USB メモリ |

      **実効アクセス時間**＝キャッシュのアクセス時間×ヒット率＋主記憶のアクセス時間×(1−ヒット率)

      **書込み方式**：ライトスルーはキャッシュと主記憶に同時に書き込み、ライトバックはキャッシュのみに書き込んで追い出し時に主記憶へ反映します。

      **試験でのポイント**：実効アクセス時間の計算式をそのまま使う問題が頻出です。
  - title: 補助記憶装置と入出力
    body: |
      **磁気ディスク**の平均アクセス時間＝平均シーク時間＋平均回転待ち時間＋データ転送時間。平均回転待ち時間は1回転の時間の半分です。

      **RAID**：
      | レベル | 方式 | 特徴 |
      |---|---|---|
      | RAID0 | ストライピング | 高速だが冗長性なし |
      | RAID1 | ミラーリング | 同じデータを2台に書く。容量効率50％ |
      | RAID5 | パリティ分散 | 1台の故障に耐える。容量は（台数−1）台分 |
      | RAID6 | 二重パリティ | 2台の故障に耐える |

      入出力インタフェースには USB、HDMI、Bluetooth、NFC などがあります。DMA は CPU を介さずに入出力装置と主記憶の間でデータを転送する方式です。

      **試験でのポイント**：RAID5 で 4台構成なら実効容量は3台分です。
  - title: システムの処理形態と構成
    body: |
      **処理形態**：バッチ処理（データをまとめて処理）、オンライントランザクション処理、リアルタイム処理があります。

      **クライアントサーバシステム**の3層構造は、プレゼンテーション層・ファンクション層（アプリケーション層）・データ層に分けます。

      **冗長構成**：
      - デュアルシステム：2系統で同じ処理を行い結果を照合する
      - デュプレックスシステム：主系と待機系を用意し、障害時に切り替える
      - ホットスタンバイ：待機系を起動状態で待機させ、すぐ切り替えられる
      - ウォームスタンバイ：待機系を一部起動した状態で待機させる
      - コールドスタンバイ：障害発生後に待機系を起動する
      - アクティブ-アクティブ構成：複数系統がともに処理し、負荷を分担する

      **仮想化**：サーバ仮想化、VDI（デスクトップ仮想化）、ライブマイグレーション（稼働中の仮想マシンを停止せずに別の物理サーバへ移動）などがあります。

      **試験でのポイント**：スケールアウトは台数を増やす、スケールアップは1台の性能を上げる方式です。
  - title: 信頼性と稼働率
    body: |
      **MTBF**（平均故障間隔）と **MTTR**（平均修復時間）から、稼働率＝MTBF÷(MTBF＋MTTR) で求めます。

      **直列システム**：すべてが稼働して初めて稼働。稼働率＝A₁×A₂

      **並列システム**：どれか1つが稼働すれば稼働。稼働率＝1−(1−A₁)(1−A₂)

      例：稼働率 0.9 の装置2台を直列にすると 0.81、並列にすると 1−0.1×0.1＝0.99 です。

      **RASIS**：信頼性（Reliability）、可用性（Availability）、保守性（Serviceability）、完全性（Integrity）、安全性（Security）。

      **設計思想**：
      - フェールセーフ：故障時に安全側に倒す
      - フェールソフト：機能を縮小しても運転を継続する
      - フォールトトレランス：冗長化で故障しても機能を維持する
      - フールプルーフ：誤操作をしても危険が生じないようにする

      **試験でのポイント**：複合構成は並列部分を先に1つの装置にまとめてから直列計算します。
  - title: 性能評価
    body: |
      **スループット**は単位時間あたりの処理量、**レスポンスタイム**は要求を出してから最初の応答が返るまでの時間、**ターンアラウンドタイム**はジョブを投入してから結果がすべて得られるまでの時間です。

      **待ち行列（M/M/1）**：
      - 利用率 ρ＝平均到着率÷平均サービス率
      - 平均待ち時間＝ρ÷(1−ρ)×平均サービス時間

      利用率が1に近づくと待ち時間は急激に増加します。

      **ベンチマーク**には SPEC（CPU 性能等）、TPC（トランザクション処理性能）などがあります。

      **試験でのポイント**：ρ＝0.5 なら平均待ち時間は平均サービス時間と同じ、ρ＝0.8 なら4倍です。
  - title: プロセッサの動作原理と並列処理
    body: |
      **レジスタ**：汎用レジスタ、命令レジスタ、プログラムカウンタ、スタックポインタなどがあります。インデックスレジスタ（指標レジスタ）は配列の添字のような修飾値、ベースレジスタは基準アドレスを保持します。

      **アドレス指定方式**：
      | 方式 | 実効アドレスの求め方 |
      |---|---|
      | 即値 | オペランドそのものがデータ |
      | 直接 | オペランドが対象のアドレス |
      | 間接 | オペランドが指すアドレスに、対象のアドレスが入っている |
      | インデックス | オペランド＋インデックスレジスタの値 |
      | ベース | オペランド＋ベースレジスタの値 |

      **割込み**は実行中のプログラムを中断して別の処理を行う仕組みで、入出力割込み、SVC（スーパバイザコール）割込みなどがあります。

      **制御方式**：ワイヤドロジック制御は論理回路で、マイクロプログラム制御はマイクロプログラムで命令を実行します。

      **並列処理の分類**：SISD（単一命令・単一データ）、SIMD（単一命令・複数データ）、MISD、MIMD（複数命令・複数データ）。GPU は多数の演算器で SIMD 的な並列処理を行うプロセッサです。

      **マルチプロセッサ**：主記憶を共有する密結合と、各プロセッサが独立した主記憶を持つ疎結合があります。**アムダールの法則**：処理の割合 p を n 倍速くしたときの全体の速度向上は 1÷((1−p)＋p÷n) で、並列化できない部分が上限を決めます。

      **試験でのポイント**：サイクルタイムはクロック周期、FLOPS は1秒あたりの浮動小数点演算数です。
  - title: メモリ・バス・入出力の補足
    body: |
      **ROM** は読出し専用の不揮発メモリです。メモリモジュールには DIMM（デスクトップ用）や SO-DIMM（ノート PC 用）があります。**ウェアレベリング**はフラッシュメモリの書込みを分散させて寿命を延ばす技術です。

      **バス**：アドレスバス（アドレスを送る）、データバス（データを送る）、制御バス（制御信号を送る）。シリアルバスは1本の信号線でビットを順に送り、パラレルバスは複数本で同時に送ります。

      **接続形態**：デイジーチェーン接続は機器を数珠つなぎにし、スター接続はハブを中心に接続します。

      **入出力制御**：プログラム制御方式では CPU が転送を行い、DMA 方式では DMA コントローラが転送を行うため CPU の負荷が下がります。

      **デバイスドライバ**は OS と周辺機器の差を吸収し、機器を制御するソフトウェアです。

      **試験でのポイント**：ブロック化因数は1ブロックに格納する論理レコードの数で、大きいほど記憶効率と転送効率が上がります。
  - title: 信頼性設計・システム評価の補足
    body: |
      **バックアップサイト**：ホットサイトは常時稼働して即時切替え、ウォームサイトは設備のみ用意して短時間で切替え、コールドサイトは場所と基本設備のみで復旧に時間がかかります。

      **フォールト（故障の原因）への対応**：フォールトアボイダンスは故障が起きにくくする、フォールトトレランスは故障しても機能を維持する、フォールトマスキングは冗長構成で故障の影響を隠す考え方です。

      **バスタブ曲線**：故障率は、初期故障期（高い）→偶発故障期（低く安定）→摩耗故障期（上昇）と推移します。

      **キャパシティプランニング**は、将来の負荷を見積もって必要な資源を計画することです。**TCO** は導入費用に運用・保守費用を加えた総保有コストです。

      **試験でのポイント**：デュアルシステムは同時処理で結果照合、デュプレックスは主系と待機系と区別します。
