id: ref-software-hardware
title: ソフトウェア・ハードウェア
categories: ['5', '6']
sections:
  - title: OS の役割とタスク管理
    body: |
      OS はハードウェア資源を管理し、アプリケーションに共通機能を提供します。主な機能は、タスク（プロセス）管理、記憶管理、入出力管理、ファイル管理です。

      **タスクの状態**：
      - 実行状態：CPU を使用中
      - 実行可能状態：CPU の割当てを待っている
      - 待ち状態：入出力の完了などを待っている

      待ち状態から直接実行状態には移らず、いったん実行可能状態になります。

      **スケジューリング方式**：到着順、優先度順、ラウンドロビン（一定時間ごとに順番に切り替える）、処理時間順などがあります。**プリエンプティブ**方式では OS が実行中のタスクを中断して別のタスクに切り替えられます。

      **試験でのポイント**：タスクの状態遷移図と、スケジューリングの実行順序を時刻ごとに追う問題が頻出です。
  - title: 記憶管理と仮想記憶
    body: |
      **仮想記憶**は補助記憶を使って、主記憶より大きなアドレス空間を提供します。

      **ページング方式**では、プログラムを固定長のページに分割します。必要なページが主記憶にないと**ページフォールト**が発生し、ページを読み込みます（ページイン）。

      **ページ置換えアルゴリズム**：
      | 方式 | 追い出すページ |
      |---|---|
      | FIFO | 最も古く読み込まれたページ |
      | LRU | 最も長い間参照されていないページ |
      | LFU | 参照回数が最も少ないページ |

      ページの入れ替えが頻発して処理効率が極端に落ちる現象を**スラッシング**といいます。

      **試験でのポイント**：ページ参照列を与えられて、ページフォールトの回数を数える問題が出ます。枠の状態を表にして追います。
  - title: 排他制御とデッドロック
    body: |
      複数のタスクが共有資源を同時に更新すると矛盾が生じるため、**排他制御**を行います。代表的な手法がセマフォで、P 操作（資源を獲得、カウンタを減らす）と V 操作（資源を解放、カウンタを増やす）を用います。

      **デッドロック**は、複数のタスクが互いに相手の確保している資源を待ち続けて処理が進まなくなる状態です。

      防止策：
      - 資源を確保する順序をすべてのタスクで統一する
      - 必要な資源を一括して確保する

      **試験でのポイント**：「タスク A が資源 X→Y、タスク B が資源 Y→X の順に確保」する組合せはデッドロックの典型例です。
  - title: ファイルシステムと開発ツール
    body: |
      **ディレクトリ**は木構造で管理します。ルートから目的のファイルまでのパスを**絶対パス**、カレントディレクトリからのパスを**相対パス**といいます。`..` は親ディレクトリ、`.` はカレントディレクトリを表します。

      **バックアップ方式**：
      | 方式 | 対象 | 復元に必要なもの |
      |---|---|---|
      | フル | 全データ | フルのみ |
      | 差分 | 前回フル以降の変更 | フル＋最新の差分 |
      | 増分 | 前回バックアップ以降の変更 | フル＋すべての増分 |

      **言語処理の流れ**：ソースプログラム → コンパイラ → 目的プログラム → リンカ（連係編集）→ ロードモジュール → ローダ → 実行。

      **OSS（オープンソースソフトウェア）**はソースコードが公開され、ライセンスの条件内で利用・改変・再配布できます。GPL は改変物にも同じライセンスの適用を求めます（コピーレフト）。

      **試験でのポイント**：増分はバックアップが速いが復元に手間がかかり、差分はその逆です。
  - title: ハードウェアと論理回路
    body: |
      **半加算器**は 1ビット同士を加算し、和（S）を XOR、桁上がり（C）を AND で求めます。**全加算器**は下位からの桁上がりも含めて加算する回路で、半加算器2つと OR で構成できます。

      **フリップフロップ**は1ビットを記憶する順序回路で、SRAM やレジスタに使われます。

      **組込みシステム**の要素：
      - センサ：物理量を検出する（温度、加速度、光など）
      - アクチュエータ：電気信号を物理的な動きに変える（モータなど）
      - FPGA：利用者がプログラムで論理回路を書き換えられる LSI
      - SoC：システムに必要な機能を1チップに集積したもの

      **省電力**：クロックゲーティング（使わない回路へのクロック供給を止める）やパワーゲーティング（電源供給を止める）があります。

      **試験でのポイント**：論理回路図は入力値を代入して出力を真理値表で確かめます。
  - title: OS・ミドルウェアの補足
    body: |
      **プロセスとスレッド**：プロセスは資源を独立して持つ実行単位、スレッドは1つのプロセス内で資源を共有する、より小さな実行単位です。

      **カーネル**：OS の中核部分です。モノリシックカーネルは主要機能をカーネル内に持ち、マイクロカーネルは最小限の機能だけをカーネルに置きます。カーネルモード（特権モード）では特権命令を実行でき、ユーザーモードでは制限されます。

      **実記憶管理**：実行中のプログラムを主記憶と補助記憶の間で入れ替えるスワップイン／スワップアウト、空き領域の断片化を解消するコンパクション、不要になった領域を回収するガベージコレクションがあります。

      **ミドルウェア**は OS とアプリケーションの間で共通機能を提供するソフトウェアで、DBMS、TP モニタなどがあります。**API** はソフトウェアの機能を外部から呼び出すための取決め、**ライブラリ**は再利用できる部品の集まり、**DLL** は実行時に結合するライブラリです。**シェル**は利用者の入力したコマンドを解釈して OS に伝えます（コマンドインタプリタ）。

      **ファイル**：シンボリックリンク（ショートカット）は別のファイルを指す参照情報です。ファイルへのアクセス方式には、先頭から順に読む順次アクセスと、位置を指定して読む直接アクセスがあります。FAT や NTFS はファイルシステムの種類です。

      **試験でのポイント**：プリエンプティブはタイムスライス（タイムクウォンタム）の経過や高優先度タスクの到着で実行を奪われる方式です。
  - title: 電子回路・制御の補足
    body: |
      **半導体部品**：ダイオードは電流を一方向にだけ流し、LED は電流を流すと発光するダイオードです。トランジスタはスイッチや増幅に使い、これを多数集積したものが IC、LSI、VLSI です。

      **制御方式**：シーケンス制御はあらかじめ定めた順序で動作させ、フィードバック制御（クローズドループ）は結果を検出して修正します。**PWM 制御**はパルス幅を変えて平均の電力を調整する方式です。

      **論理設計**：正論理は高電圧を 1、負論理は低電圧を 1 とみなす表し方です。論理式は真理値表から導き、NAND だけで任意の回路を構成できます。

      **試験でのポイント**：NAND 回路は、AND の出力を反転した回路です。
