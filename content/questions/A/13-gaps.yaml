category: '13'
reviewed:
  at: '2026-10-21'
  method: 作成後の逐問レビュー（構造化手法の各技法の定義と開発環境管理の用語例をシラバスVer.9.2と照合）
questions:
  - id: A13-046
    topic: 13-1-2
    diff: 2
    q: 構造化手法で用いられる表記法と，その表記法で主に表す内容の組合せとして，適切なものはどれか。
    c:
      - HIPO — データの流れと，データを変換するプロセス及びデータストア
      - 構造化チャート — プログラムを構成するモジュールの階層的な呼出し関係と，モジュール間で受け渡すデータ
      - DFD — 処理の実行順序と，判定による分岐や繰返しの制御の流れ
      - 状態遷移図 — 機能の階層を表す図式目次と，各機能の入力・処理・出力
    a: イ
    exp: |
      構造化手法の主な表記法と、それぞれが主に表す内容は次のとおりです。
      | 表記法 | 主に表す内容 |
      | --- | --- |
      | 構造化チャート | モジュールの階層的な呼出し関係と、モジュール間で受け渡すデータ |
      | HIPO | 機能の階層を表す図式目次と、各機能の入力・処理・出力を表す IPO 図 |
      | DFD | データの流れと、データを変換するプロセス、データストア、外部実体 |
      | 状態遷移図 | システムの状態と、イベントによる状態間の遷移 |
      処理の実行順序や分岐・繰返しの制御の流れを表すのは、流れ図や NS 図です。
    why:
      - データの流れとプロセス・データストアを表すのは DFD です。HIPO は、図式目次と IPO 図で機能と入力・処理・出力を表します。
      - 正解です。構造化チャートは、モジュールの階層的な呼出し関係と受け渡すデータを表します。
      - 処理の実行順序や分岐・繰返しを表すのは流れ図や NS 図です。DFD は制御の流れではなく、データの流れを表します。
      - 図式目次と入力・処理・出力を表すのは HIPO です。状態遷移図は、状態とイベントによる遷移を表します。
    terms:
      - 構造化チャート
      - HIPO
      - DFD
      - 状態遷移図
      - 構造化設計
  - id: A13-047
    topic: 13-1-2
    diff: 2
    q: 構造化手法によって販売管理システムの機能を設計する。段階的詳細化の考え方に沿った進め方として，適切なものはどれか。
    c:
      - 「販売管理」を「受注」「出荷」「請求」に分け，さらに「受注」を「受注入力」「与信チェック」「在庫引当」に分けるというように，上位の機能から順に分割して，各階層で少しずつ具体化する。
      - 「受注入力」「与信チェック」「在庫引当」などの下位の部品を先にすべて完成させ，それらを組み合わせて上位の「受注」や「販売管理」を作り上げる。
      - 既存の販売管理プログラムのソースコードを解析し，そこから機能の構成や仕様を導き出す。
      - 「受注」に関するデータと，そのデータを操作する手続を一つにまとめてクラスとして定義し，内部の詳細を外部から隠蔽する。
    a: ア
    exp: |
      段階的詳細化は、トップダウンの考え方に基づき、システム全体の機能を大きな単位から順に分割し、各階層で少しずつ詳細にしていく手法です。「販売管理」→「受注・出荷・請求」→「受注入力・与信チェック・在庫引当」のように上位から下位へ分割していくと、機能が階層構造化され、構造化チャートなどで表現できます。
    why:
      - 正解です。上位の機能から下位の機能へ順に分割し、階層ごとに具体化しています。
      - 下位の部品を先に作って組み合わせるのはボトムアップの進め方であり、上位から分割していく段階的詳細化とは逆です。
      - 既存のソースコードから仕様を導き出すのはリバースエンジニアリングです。
      - データと手続をまとめて内部を隠蔽するのは、オブジェクト指向のカプセル化です。
    terms:
      - 段階的詳細化
      - 構造化設計
      - 構造化チャート
  - id: A13-048
    topic: 13-3-2-1
    diff: 2
    q: 開発環境の稼働状況管理のうち，資源管理として行う活動の例として，最も適切なものはどれか。
    c:
      - 開発者の作業時間を基に，プロジェクトの出来高を算出する。
      - 開発する製品の機能要件を利用者と合意し，要件定義書を作成する。
      - 開発用サーバの CPU 使用率やディスク使用量，ソフトウェアライセンスの使用数を把握し，不足する前に増強や再配分を行う。
      - 本番環境で発生したインシデントの根本原因を調査する。
    a: ウ
    exp: |
      開発環境の稼働状況管理では、開発用のハードウェア、ソフトウェア、ネットワーク、ライセンスなどの資源の使用状況を把握し、不足や無駄がないよう計画的に割り当てる資源管理と、開発環境の運用時間、バックアップ、利用者権限、障害対応などを管理する運用管理を行います。
    why:
      - これはプロジェクトマネジメントの EVM による進捗管理の活動です。
      - これは要件定義の活動で、開発環境の管理ではありません。
      - 正解です。開発用資源の使用状況を把握して適切に配分します。
      - これはサービスマネジメントの問題管理の活動です。
    terms:
      - 開発環境
      - EVM
      - 問題管理
