category: '04'
batch: H2
reviewed:
  at: '2026-10-30'
  method: 独立レビュー担当が解答を伏せて全問を自力検算し、正答の一意性・誤答の検証と既存問題との重複確認を実施。A04-518 の誤答の値と導出、A04-520 の誤答解説の誤りの明示、A04-524 の誤答の値と導出を差し替え、再確認で全件の整合を検証済み
questions:
  - id: A04-517
    topic: [3-1-10, 4-2-1-2]
    diff: 3
    scope: 3-1-10 マルチプロセッサシステム（用語例：アムダールの法則）と 4-2-1-2 キャパシティプランニング（性能要件から構成を検討する）。アムダールの法則で二つの改善案の高速化率を求めて比較するもので、法則の基本式の適用として範囲内
    prereq: アムダールの法則（高速化率 ＝ 1 ÷ （並列化できない割合 ＋ 並列化できる割合 ÷ コア数））
    hard: 「コアを増やす」案と「並列化できる割合を増やす」案という性質の異なる二つの改善を、同じ式でそれぞれ計算して比較する必要がある。並列化割合やコア数を単純に掛けて比べる誤りや、計算は正しくても大小の判断を誤る誤りを誘う。
    q: |
      実行時間のうち 80 ％を並列化でき、残りの 20 ％は逐次に実行しなければならないプログラムを、現在 4 コアのプロセッサで実行している。性能を改善するために、次の二つの案を検討する。アムダールの法則に基づくとき、1 コアで実行した場合に対する高速化率がより大きくなる案と、その高速化率の組合せとして、適切なものはどれか。ここで、並列化に伴うオーバヘッドは無視する。

      - 案 A：プログラムはそのままで、コア数を 8 に増やす。
      - 案 B：コア数は 4 のままで、プログラムを改修して並列化できる割合を 90 ％に増やす。
    c:
      - 案 A で、約 3.3 倍
      - 案 B で、約 3.1 倍
      - 案 B で、約 3.6 倍
      - 案 A で、約 6.4 倍
    a: ア
    exp: |
      アムダールの法則の高速化率は、1 ÷ （並列化できない割合 ＋ 並列化できる割合 ÷ コア数）で求めます。

      | 構成 | 計算 | 高速化率 |
      | --- | --- | --- |
      | 現在（80 ％、4 コア） | 1 ÷ (0.2 ＋ 0.8 ÷ 4) ＝ 1 ÷ 0.4 | 2.5 倍 |
      | 案 A（80 ％、8 コア） | 1 ÷ (0.2 ＋ 0.8 ÷ 8) ＝ 1 ÷ 0.3 | 約 3.3 倍 |
      | 案 B（90 ％、4 コア） | 1 ÷ (0.1 ＋ 0.9 ÷ 4) ＝ 1 ÷ 0.325 | 約 3.1 倍 |

      高速化率がより大きいのは案 A の約 3.3 倍です。ただし、案 A の上限は 1 ÷ 0.2 ＝ 5 倍、案 B の上限は 1 ÷ 0.1 ＝ 10 倍であり、さらにコアを増やす将来の余地まで考えると、逐次部分を減らす案 B の方が伸びしろは大きくなります。
    why:
      - 正解です。案 A は 1 ÷ (0.2 ＋ 0.1) ≒ 3.3 倍、案 B は 1 ÷ (0.1 ＋ 0.225) ≒ 3.1 倍で、案 A の方が大きくなります。
      - 案 B の高速化率 1 ÷ (0.1 ＋ 0.9 ÷ 4) ≒ 3.1 倍は値としては正しいものの、案 A の約 3.3 倍より小さいので、より大きくなる案ではありません。
      - 案 B の値を、並列化できる割合にコア数を掛けて（0.9 × 4 ＝ 3.6）求めた誤りです。逐次部分 10 ％はコア数を増やしても短くならないため、この値にはなりません。
      - 案 A の値を、並列化できる割合にコア数を掛けて（0.8 × 8 ＝ 6.4）求めた誤りです。逐次部分 20 ％がそのまま残るため、高速化率は約 3.3 倍にとどまります。
    know: アムダールの法則では、高速化率の上限は 1 ÷ 逐次部分の割合で決まる。コアを増やす改善は逐次部分に頭打ちにされ、逐次部分を減らす改善は上限そのものを引き上げる。どちらが有利かは、実際に式で計算して比べる。
    terms:
      - アムダールの法則
      - 並列処理
    verify:
      manual: 現在 1÷(0.2＋0.8÷4)＝2.5、案A 1÷(0.2＋0.8÷8)＝3.333、案B 1÷(0.1＋0.9÷4)＝3.077 を再計算し、案Aの約3.3倍が最大であることを確認。誤答の 3.6＝0.9×4、6.4＝0.8×8 も再計算で確認
  - id: A04-518
    topic: 3-2-5
    diff: 3
    scope: 3-2-5 メモリの容量と性能（キャッシュメモリのヒット率、実効アクセス時間）。ヒット時とミス時のアクセス時間から、平均の実効アクセス時間を求める問題で、シラバスの説明に明記された計算
    prereq: ヒット率による加重平均、ミス時はキャッシュへのアクセスに加えて主記憶へのアクセスが必要なこと
    hard: ミス時の時間に、キャッシュへアクセスした時間も含まれる点を見落としやすい。ヒット率とミス率で加重平均する構造も押さえる必要がある。
    q: |
      キャッシュメモリのヒット率が 90 ％、ヒット時のアクセス時間が 10 ナノ秒である。ミスした場合は、キャッシュへのアクセスに加えて主記憶からデータを読み出すために 90 ナノ秒が追加で必要になる。このとき、実効アクセス時間は何ナノ秒か。
    c:
      - '28'
      - '14.5'
      - '18'
      - '19'
    a: エ
    exp: |
      ミス時のアクセス時間は、キャッシュの 10 ナノ秒に主記憶の 90 ナノ秒を加えた 100 ナノ秒です。

      実効アクセス時間 ＝ 0.9 × 10 ＋ 0.1 × 100
      ＝ 9 ＋ 10
      ＝ 19 ナノ秒

      ヒット率で加重平均するのが要点です。
    why:
      - ヒット率を 80 ％として計算した値（0.8 × 10 ＋ 0.2 × 100 ＝ 28）です。本問のヒット率は 90 ％です。
      - ミス率を 5 ％として計算した値（0.95 × 10 ＋ 0.05 × 100 ＝ 14.5）です。本問のミス率は 10 ％です。
      - ミス時の時間を主記憶の 90 ナノ秒だけとして計算した値（0.9 × 10 ＋ 0.1 × 90 ＝ 18）です。ミス時もキャッシュへのアクセス時間が必要です。
      - 正解です。0.9 × 10 ＋ 0.1 × 100 ＝ 19 ナノ秒です。
    know: 実効アクセス時間は、ヒット時とミス時の時間をヒット率で加重平均したもの。ミス時の時間には、キャッシュへのアクセス時間も含まれる点が間違えやすい。
    terms:
      - キャッシュメモリ
      - ヒット率
      - 実効アクセス時間
    verify:
      type: value
      value: 0.9 * 10 + 0.1 * (10 + 90)
      tolerance: 0.000001
  - id: A04-519
    topic: 3-5-3
    diff: 3
    scope: 3-5-3 補助記憶装置（ハードディスク装置）。シーク時間、平均回転待ち時間、データ転送時間の合計からアクセス時間を求める問題で、ハードディスク装置の性能計算として範囲内
    prereq: 回転待ち時間は回転周期から求めること（平均は半回転分）、転送時間はデータ量を転送速度で割ること
    hard: 回転数が毎分単位で与えられるため秒・ミリ秒への換算が必要であり、平均回転待ちが半回転分である点も押さえる必要がある。
    q: |
      回転数が 6,000 回転／分の磁気ディスク装置がある。平均シーク時間が 4 ミリ秒、転送速度が 160 M バイト／秒のとき、16 K バイトのデータを読むためのアクセス時間は約何ミリ秒か。ここで、1 K バイト ＝ 1,000 バイト、1 M バイト ＝ 1,000,000 バイトとする。
    c:
      - '5.1'
      - '14.1'
      - '19.1'
      - '9.1'
    a: エ
    exp: |
      アクセス時間は、シーク時間、回転待ち時間、転送時間の合計です。
      - 回転周期： 60 秒 ÷ 6,000 回転 ＝ 0.01 秒 ＝ 10 ミリ秒。平均回転待ち時間は半回転分の 5 ミリ秒
      - 転送時間： 16,000 バイト ÷ 160,000,000 バイト／秒 ＝ 0.0001 秒 ＝ 0.1 ミリ秒
      - 合計： 4 ＋ 5 ＋ 0.1 ＝ 9.1 ミリ秒
    why:
      - シーク時間を落とした値（5 ＋ 0.1）です。アクセス時間にはシーク時間も含まれます。
      - 回転待ち時間を 1 回転分（10 ミリ秒）として計算した値です。平均の待ちは半回転分です。
      - 回転待ち時間を 1 回転分とし、さらに平均待ちも加えた値です。回転待ちは平均の 5 ミリ秒だけを数えます。
      - 正解です。4 ＋ 5 ＋ 0.1 ＝ 9.1 ミリ秒です。
    know: ディスクのアクセス時間は「平均シーク時間 ＋ 平均回転待ち時間（半回転分）＋ 転送時間」の合計。回転数から回転周期への換算と、平均待ちが半分になる理由が要点である。
    terms:
      - シーク時間
      - 回転待ち時間
      - データ転送時間
    verify:
      type: value
      value: 4 + (60 * 1000 / 6000) / 2 + 16000 / 160000000 * 1000
      tolerance: 0.000001
  - id: A04-520
    topic: 4-2-2-2
    diff: 2
    scope: 4-2-2-2 信頼性指標と信頼性計算（MTBF、MTTR、稼働率）。稼働率の式 MTBF ÷（MTBF ＋ MTTR）を、目標の稼働率から許される MTTR について解く問題で、稼働率の基本的な計算の範囲内
    prereq: 稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）であること、不等式を MTTR について解くこと
    q: |
      MTBF が 1,980 時間の装置がある。この装置の稼働率を 99 ％以上にするためには、MTTR を最大何時間以内にする必要があるか。
    c:
      - '20'
      - '19.8'
      - '2000'
      - '198'
    a: ア
    exp: |
      稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）なので、1,980 ÷（1,980 ＋ MTTR）≧ 0.99 を MTTR について解きます。

      1,980 ＋ MTTR ≦ 1,980 ÷ 0.99 ＝ 2,000
      MTTR ≦ 2,000 － 1,980 ＝ 20 時間

      確かめると、1,980 ÷（1,980 ＋ 20）＝ 1,980 ÷ 2,000 ＝ 0.99 です。MTBF × （1 － 稼働率）＝ 19.8 という近似は、稼働率を「1 － MTTR ÷ MTBF」と取り違えた式であり、分母が MTBF ＋ MTTR であることを忘れると生じます。
    why:
      - 正解です。1,980 ÷ 0.99 － 1,980 ＝ 20 時間です。
      - MTBF × （1 － 0.99）＝ 19.8 と計算した値です。これは稼働率を 1 － MTTR ÷ MTBF と考えた場合の式で、正しい分母は MTBF ＋ MTTR です。
      - 1,980 ÷ 0.99 ＝ 2,000 を求めたところで止めた値です。2,000 時間は MTBF ＋ MTTR の上限なので、MTBF の 1,980 時間を引く必要があります。
      - 1 － 0.99 を 0.1 と桁を誤り、1,980 × 0.1 ＝ 198 とした値です。停止してよい割合は 0.01 です。
    know: 稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）は、目標稼働率から許容される MTTR や必要な MTBF を逆算する形でも使う。稼働率を上げるには、MTBF を延ばすか MTTR を縮めるかの二つの方向がある。
    terms:
      - 稼働率
      - MTBF
      - MTTR
    verify:
      type: value
      value: 1980 / 0.99 - 1980
      tolerance: 0.000001
  - id: A04-521
    topic: 4-2-2-2
    diff: 2
    scope: 4-2-2-2 信頼性指標と信頼性計算（MTBF、直列システム）。故障率が一定の装置を直列に接続した場合の、システム全体の MTBF を求める問題
    prereq: MTBF は故障率の逆数であること、直列系では故障率が加算されること
    q: |
      故障率が 0.001／時間で一定の装置がある。この装置を 4 台直列に接続したシステム全体の MTBF は何時間か。ここで、直列系ではいずれか 1 台の故障がシステム全体の故障になるものとする。
    c:
      - '250'
      - '1000'
      - '4000'
      - '500'
    a: ア
    exp: |
      直列系では、故障率は台数分だけ加算されます。システム全体の故障率は 0.001 × 4 ＝ 0.004／時間です。

      MTBF ＝ 1 ÷ 故障率 ＝ 1 ÷ 0.004 ＝ 250 時間

      装置 1 台だけなら MTBF は 1 ÷ 0.001 ＝ 1,000 時間ですが、直列では「どれか 1 台が故障すれば全体が故障する」ため、故障の機会が台数分に増えます。故障率は加算、MTBF はその逆数という関係を押さえることが要点です。
    why:
      - 正解です。故障率は 4 台分で 0.004／時間となり、MTBF はその逆数の 250 時間です。
      - 装置 1 台だけの MTBF（1 ÷ 0.001）です。直列では台数分だけ故障しやすくなります。
      - 台数を掛けてしまった値です。直列では MTBF は増えるのではなく、故障率が加算されて MTBF は短くなります。
      - 2 台分として計算した値です。本問は 4 台の直列です。
    know: 故障率が一定（指数分布）の部品では、直列系の故障率は各故障率の和になり、MTBF はその逆数。並列冗長とは逆に、直列の台数が増えるほど MTBF は短くなる。
    terms:
      - 故障率
      - MTBF
    verify:
      type: value
      value: 1 / (0.001 * 4)
      tolerance: 0.000001
  - id: A04-522
    topic: 4-2-1-1
    diff: 3
    scope: 4-2-1-1 システムの性能指標（用語例：ターンアラウンドタイム、スループット）。FCFS で処理するジョブの完了時刻から、平均ターンアラウンド時間を求める問題
    prereq: ターンアラウンド時間は「完了時刻 － 到着時刻」であること、先着順（FCFS）では前のジョブの完了を待つこと
    hard: 各ジョブの完了時刻が、到着時刻と前のジョブの処理の積み重ねで決まることを追い、到着時刻を引く前の量（完了時刻の平均など）と混同しない必要がある。
    q: |
      3 つのジョブを 1 台の処理装置で先着順（FCFS）に処理する。各ジョブの到着時刻と処理時間（分）が次の表のとき、平均ターンアラウンド時間は何分か。

      | ジョブ | 到着時刻（分） | 処理時間（分） |
      | --- | --- | --- |
      | J1 | 0 | 5 |
      | J2 | 1 | 3 |
      | J3 | 2 | 4 |
    c:
      - '8.33'
      - '7.33'
      - '3.33'
      - '4'
    a: イ
    exp: |
      FCFS では、J1 が 0〜5 分、J2 は J1 の完了を待って 5〜8 分、J3 は 8〜12 分に処理されます。
      - J1： 完了 5、ターンアラウンド ＝ 5 － 0 ＝ 5
      - J2： 完了 8、ターンアラウンド ＝ 8 － 1 ＝ 7
      - J3： 完了 12、ターンアラウンド ＝ 12 － 2 ＝ 10
      平均は (5 ＋ 7 ＋ 10) ÷ 3 ＝ 22 ÷ 3 ≒ 7.33 分です。
    why:
      - 平均完了時刻（(5 ＋ 8 ＋ 12) ÷ 3 ≒ 8.33）です。到着時刻を引いていません。
      - 正解です。各ジョブの（完了時刻 － 到着時刻）の平均で、約 7.33 分です。
      - 平均待ち時間（(0 ＋ 4 ＋ 6) ÷ 3 ≒ 3.33）です。ターンアラウンド時間には処理時間自身も含まれます。
      - 平均処理時間（(5 ＋ 3 ＋ 4) ÷ 3）です。待ち時間が含まれていません。
    know: ターンアラウンド時間は、投入（到着）から完了までの経過時間であり、待ち時間と処理時間の合計に等しい。完了時刻の平均とは別物で、到着時刻を引くことが要点である。
    terms:
      - ターンアラウンド時間
    verify:
      type: value
      value: ((5 - 0) + (8 - 1) + (12 - 2)) / 3
      tolerance: 0.005
  - id: A04-523
    topic: 3-1-10
    diff: 3
    scope: 3-1-10 マルチプロセッサシステム（用語例：アムダールの法則、同期）。逐次部分、並列化できる部分、同期のオーバヘッドを組み合わせて実行時間を求める問題
    prereq: 並列化できる部分はプロセッサ数で割れること、逐次部分とオーバヘッドは割れないこと
    hard: 実行時間が3つの要素（割れない逐次部分、割れる並列部分、割れないオーバヘッド）の合計になることを見抜き、それぞれを正しく扱う必要がある。
    q: |
      逐次に実行すると 120 秒かかる処理がある。この処理は、並列化できない部分が 20 秒、残りの 100 秒はプロセッサ数に応じて分割できる部分から成る。これを 4 台のプロセッサで並列実行すると、同期や通信のオーバヘッドが合計 8 秒発生する。全体の実行時間は何秒か。
    c:
      - '30'
      - '45'
      - '53'
      - '120'
    a: ウ
    exp: |
      実行時間は、3つの要素の合計です。
      - 逐次部分： 20 秒（そのまま）
      - 並列部分： 100 ÷ 4 ＝ 25 秒
      - オーバヘッド： 8 秒（そのまま）
      合計は 20 ＋ 25 ＋ 8 ＝ 53 秒です。高速化率は 120 ÷ 53 ≒ 2.26 にとどまります。
    why:
      - 全体を 4 台で割った値（120 ÷ 4）です。逐次部分とオーバヘッドは割り算できません。
      - オーバヘッドを落とした値（20 ＋ 25）です。本問では同期などのオーバヘッド 8 秒が発生します。
      - 正解です。20 ＋ 25 ＋ 8 ＝ 53 秒です。
      - 逐次実行の時間そのものです。並列部分は 25 秒に短縮されます。
    know: 並列実行の実行時間は、逐次部分、分割できる部分（台数で割る）、オーバヘッド（台数を増やすと増えることもある）の合計で決まる。台数を増やしても逐次部分とオーバヘッドが下限を作る。
    terms:
      - 並列処理
      - オーバヘッド
    verify:
      type: value
      value: 20 + 100 / 4 + 8
  - id: A04-524
    topic: [4-2-2-2, 4-1-7]
    diff: 4
    scope: 4-2-2-2 信頼性計算（稼働率）と 4-1-7 信頼性設計（アクティブ-スタンバイ構成）。切替えの成功率を考慮して、主系・待機系の構成の実効的な稼働率を求める問題
    prereq: 主系が故障したときにだけ待機系と切替えが関与すること、各事象の確率を掛け合わせて経路ごとに足すこと
    hard: 理想的な並列系の式（1 － 故障率の積）をそのまま使えず、切替えが成功するという条件を経路に組み込む必要がある。
    q: |
      主系と待機系から成るシステムがある。主系と待機系の稼働率はどちらも 0.99 で、主系が故障したときに待機系へ正しく切り替わる確率は 0.90 である。このシステムの実効的な稼働率として最も近い値はどれか。ここで、稼働率が最も近いパーセントの値を選ぶこと。
    c:
      - '99.99'
      - '98.01'
      - '99.89'
      - '99'
    a: ウ
    exp: |
      システムが稼働する経路は2つあります。
      - 主系が稼働する： 0.99
      - 主系が故障し（0.01)、切替えが成功し（0.90)、待機系が稼働する（0.99)： 0.01 × 0.90 × 0.99 ＝ 0.00891
      合計は 0.99 ＋ 0.00891 ＝ 0.99891、すなわち約 99.89 ％です。切替えの失敗が、理想的な並列系との差を生みます。
    why:
      - 切替えが常に成功すると仮定した理想的な並列系の値（1 － 0.01 × 0.01 ＝ 99.99 ％）です。本問では切替えの失敗が 10 ％あります。
      - 主系と待機系の両方が稼働していないと動かない、直列構成と誤解した場合の値（0.99 × 0.99 ＝ 0.9801）です。本問の待機系は、主系が故障したときだけ使われます。
      - 正解です。0.99 ＋ 0.01 × 0.90 × 0.99 ≒ 99.89 ％です。
      - 主系だけの稼働率です。待機系への切替えが成功する経路も稼働に寄与します。
    know: 待機系の実効稼働率は「主系の稼働 ＋ 主系の故障 × 切替え成功 × 待機系の稼働」で決まる。切替えの成功率が 1 でない限り、単純な並列系の式（1 － 故障率の積）にはならない。
    terms:
      - フェイルオーバ
      - 稼働率
    verify:
      manual: 主系稼働 0.99 に、主系故障 0.01 × 切替成功 0.90 × 待機系稼働 0.99 ＝ 0.00891 を加えると 0.99891 となり、選択肢の 99.89 が最も近いことを再計算で確認
