questions:
  - id: A23-055
    topic: 23-1-1
    diff: 2
    q: 半導体集積回路の回路配置（回路素子とそれを接続する導線の配置）を保護する権利で，設定の登録を受けることによって発生するものはどれか。
    c:
      - 実用新案権
      - 回路配置利用権
      - 意匠権
      - 著作権
    a: イ
    exp: |
      回路配置利用権は，「半導体集積回路の回路配置に関する法律」に基づく知的財産権で，回路配置の創作者などが設定の登録を受けることによって発生し，存続期間は設定登録の日から 10 年です。登録された回路配置を利用して半導体集積回路を製造する権利を専有します。特許権・実用新案権・意匠権・商標権の四つの産業財産権とは別の法律で保護される権利で，創作と同時に発生する著作権とも異なります。
    why:
      - 実用新案権は，物品の形状，構造又は組合せに係る考案を保護する権利で，回路配置を保護するものではありません。
      - 正解です。半導体集積回路の回路配置は，設定登録によって発生する回路配置利用権で保護されます。
      - 意匠権は，物品などの形状，模様，色彩などの視覚を通じて美感を起こさせるデザインを保護する権利です。
      - 著作権は，著作物の創作と同時に登録なしで発生する権利で，回路配置を保護する権利ではありません。
    terms:
      - 産業財産権
      - 実用新案権
      - 意匠権
      - 著作権
  - id: A23-056
    topic: 23-3-2-3
    diff: 1
    q: 民法の特別法として，商人の営業や商行為について定めた法律はどれか。
    c:
      - 商法
      - 特定商取引法
      - 会社法
      - 不正競争防止法
    a: ア
    exp: |
      商法は，商人の営業，商行為，商号，商業帳簿などについて，一般法である民法に対する特別法として定める法律です。株式会社など会社の設立，機関，運営については会社法が定めています。特定商取引法は訪問販売など消費者トラブルを生じやすい取引を，不正競争防止法は事業者間の公正な競争を確保するためのルールを定めます。
    why:
      - 正解です。商人の営業や商行為に関する基本的な事項を定めるのが商法です。
      - 特定商取引法は，訪問販売，通信販売などの消費者保護のための取引ルールを定める法律です。
      - 会社法は，会社の設立，機関，組織再編などを定める法律です。
      - 不正競争防止法は，営業秘密の保護など公正な競争を確保するための法律です。
    terms:
      - 商法
  - id: A23-057
    topic: 23-3-2-4
    diff: 2
    q: 特定商取引法において，クーリング・オフ制度の対象となる取引はどれか。
    c:
      - 電子マネーに現金をチャージする取引
      - インターネットの通販サイトで商品を購入する通信販売
      - 店舗に出向いて自分の意思で商品を購入する取引
      - 自宅を訪問してきた販売員から商品を購入する訪問販売
    a: エ
    exp: |
      クーリング・オフは，契約後に法定書面を受け取ってから一定期間内であれば，消費者が理由を問わず契約を解除できる制度です。特定商取引法では，訪問販売，電話勧誘販売，連鎖販売取引などが対象です。通信販売にはクーリング・オフの制度はありません。返品の可否や条件（返品特約）は事業者が広告に表示し，表示がない場合は，商品を受け取った日から 8 日以内であれば購入者が契約を解除（返品）できます（特定商取引法第 15 条の 3）。
    why:
      - 電子マネーへのチャージは，特定商取引法のクーリング・オフ制度の対象取引ではありません。
      - 通信販売にはクーリング・オフの制度がありません。返品の条件は広告に表示された返品特約により，特約の表示がない場合に限り，商品の受領から 8 日以内の返品が法律で認められています。
      - 消費者が店舗に出向いて自分の意思で購入する取引は，クーリング・オフの対象ではありません。
      - 正解です。訪問販売はクーリング・オフの対象です。
    terms:
      - 特定商取引法
      - クーリング・オフ
  - id: A23-058
    topic: 23-3-3-1
    diff: 2
    q: システムの運用支援を準委任契約で外部に委託した。民法の規定に照らして，受託者（受任者）の義務として適切なものはどれか。
    c:
      - 委託者の許諾がなくても，自由に第三者に業務を再委託できる。
      - 委託者から請求があれば，いつでも業務の処理の状況を報告し，契約が終了した後は遅滞なくその経過及び結果を報告する。
      - 成果物を完成させる義務を負い，成果物が契約の内容に適合しなければ，請負契約と同じく修補などの責任を負う。
      - 業務の処理の状況は，契約が終了するまで委託者に報告してはならない。
    a: イ
    exp: |
      準委任契約（法律行為でない事務の委託）には，民法の委任の規定が準用されます（第 656 条）。受任者は，善良な管理者の注意をもって事務を処理する義務を負い（第 644 条），委任者の請求があるときはいつでも処理の状況を報告し，委任が終了した後は遅滞なくその経過及び結果を報告しなければなりません（第 645 条）。また，委任者の許諾を得たとき又はやむを得ない事由があるときでなければ，復受任者（再委託先）を選任できません（第 644 条の 2）。仕事の完成義務と，成果物の契約不適合に対する責任は，請負契約の特徴です。
    why:
      - 受任者は，委任者の許諾を得たとき又はやむを得ない事由があるときでなければ，復受任者を選任できません。自由に再委託できるわけではありません。
      - 正解です。請求に応じた状況の報告と，終了後の経過・結果の報告は，受任者の義務として民法に定められています。
      - 仕事の完成義務と契約不適合責任は請負契約の内容です。準委任契約の受任者は，原則として仕事の完成義務を負いません。
      - 報告を禁じる規定はなく，反対に，委任者の請求があればいつでも状況を報告する義務を負います。
    terms:
      - 準委任契約
      - 請負契約
      - 善管注意義務
  - id: A23-059
    topic: 23-3-3-2
    diff: 1
    q: システム開発の委託先に業務上の機密情報を開示するにあたり，守秘契約（NDA）で定める内容として，最も適切なものはどれか。
    c:
      - 秘密情報を漏えいしても，受領した側は責任を負わないこと
      - 開示された情報は，受領した側が自由に利用し，公開できること
      - 秘密情報の取扱いは，契約終了後すぐに全て不要となること
      - 開示された秘密情報を契約で定めた目的以外に使用せず，事前の承諾なく第三者に開示しないこと
    a: エ
    exp: |
      守秘契約（秘密保持契約，NDA）は，取引や共同開発などにあたって開示する秘密情報について，目的外使用の禁止，第三者への開示の禁止，管理方法，複製の制限，契約終了後の返還・廃棄，違反時の責任などを定める契約です。契約終了後も秘密を守る義務を一定期間存続させるのが一般的です。
    why:
      - 漏えいした場合の責任を定めることが守秘契約の重要な内容です。
      - 自由に利用して公開できるのでは，秘密を守る契約になりません。
      - 契約終了後も一定期間は秘密を守る義務を存続させるのが一般的です。
      - 正解です。目的外使用と第三者への開示の禁止が守秘契約の中心です。
    terms:
      - 守秘契約
      - 秘密情報
  - id: A23-060
    topic: 23-3-3-4
    diff: 2
    q: 「情報システム・モデル取引・契約書」が示す，ソフトウェア開発における多段階契約の考え方として，適切なものはどれか。
    c:
      - 発注者は要件定義に関与せず，全て受注者に任せる。
      - 開発の開始時に，全工程の内容と金額を一括して確定し，途中での変更は一切認めない。
      - 開発を要件定義，設計，開発・テストなどの工程に分けて，工程ごとに個別契約を結び，前の工程の成果を踏まえて次の工程の契約内容を確定する。
      - 契約は口頭で行い，書面は作成しない。
    a: ウ
    exp: |
      「情報システム・モデル取引・契約書」は，2007年に経済産業省が公開し，その後 IPA が民法改正などを踏まえて見直した第二版（2020年公開）が現行版で，開発の初期には要件が確定しにくいことから，工程ごとに個別契約を結ぶ多段階契約を採用しています。前の工程の成果を踏まえて次の工程の範囲や金額を確定でき，発注者と受注者の認識の違いやリスクを段階的に減らせます。基本契約で共通の取決めをし，個別契約で各工程の内容を定めるのが基本です。
    why:
      - 要件定義には発注者の関与が不可欠で，全てを受注者に任せるのは適切ではありません。
      - 全工程を一括で確定して変更を認めない方式では，要件が確定しにくい開発のリスクが大きくなります。
      - 正解です。工程ごとの個別契約で，前の成果を次の契約内容に反映します。
      - 契約内容は書面で明確にしておくことが基本です。
    terms:
      - 情報システム・モデル取引・契約書
      - 多段階契約
  - id: A23-061
    topic: 23-4-2
    diff: 2
    q: 官民データ活用推進基本法の内容として，適切なものはどれか。
    c:
      - 事業者が保有する官民データを，全て無償で一般に公開することを義務付けている。
      - 国，地方公共団体，事業者が保有する官民データの活用を推進するため，行政手続のオンライン利用の原則化などの基本的な施策を定めている。
      - 個人のプライバシーを守るため，官民データの活用を禁止している。
      - 国の機関だけを対象とし，地方公共団体や事業者には適用されない。
    a: イ
    exp: |
      官民データ活用推進基本法は，国，地方公共団体，事業者が保有する官民データを適正かつ効果的に活用することで，国民が安心して暮らせる社会と経済の活力の向上を図ることを目的とした法律です。行政手続のオンライン利用の原則化，官民データの活用推進，情報通信技術の利用機会や活用に係る格差の是正などの基本的な施策を定めています。
    why:
      - 事業者のデータを全て無償で公開する義務を定めたものではありません。
      - 正解です。官民データの活用推進と行政手続のオンライン利用の原則化などを定めています。
      - 活用を禁止するのではなく，適正かつ効果的な活用を推進する法律です。
      - 国，地方公共団体，事業者の三者を対象としています。
    terms:
      - 官民データ活用推進基本法
      - 官民データ
  - id: A23-062
    topic: 23-4-5-1
    diff: 2
    q: 電気通信事業者の取扱中に係る通信の秘密を侵してはならないことを定め，電気通信事業の公正な競争の促進や電気通信役務の利用者の利益の保護を目的とする法律はどれか。
    c:
      - 通信傍受法
      - 情報流通プラットフォーム対処法
      - 電波法
      - 電気通信事業法
    a: エ
    exp: |
      電気通信事業法は，電気通信事業の公共性に鑑み，その運営を適正かつ合理的なものとするとともに，公正な競争を促進することで，電気通信役務の円滑な提供を確保し，利用者の利益を保護することなどを目的とする法律です（第 1 条）。第 4 条で，電気通信事業者の取扱中に係る通信の秘密は侵してはならないと定め，電気通信事業に従事する者には在職中だけでなく退職後も通信の秘密を守る義務を課しています。
    why:
      - 通信傍受法は，組織的な犯罪の捜査のために，令状に基づいて行う通信の傍受の要件や手続を定める法律です。
      - 情報流通プラットフォーム対処法（旧プロバイダ責任制限法）は，権利侵害情報が流通した場合の発信者情報の開示請求や，大規模なプラットフォーム事業者の削除対応などを定める法律です。
      - 電波法は，電波の公平かつ能率的な利用を確保するため，無線局の免許などを定める法律です。
      - 正解です。電気通信事業法が，通信の秘密の保護や電気通信事業の公正な競争の促進を定めています。
    terms:
      - 情報流通プラットフォーム対処法
  - id: A23-063
    topic: 23-4-5-3
    diff: 2
    q: 会社法において，株式会社で取締役の職務の執行を監査する機関はどれか。
    c:
      - 監査役
      - 取締役会
      - 株主総会
      - 執行役
    a: ア
    exp: |
      監査役は，取締役の職務の執行を監査する株式会社の機関で，業務監査と会計監査を行います。株主総会は取締役などの選任や定款変更などを決議する機関，取締役会は会社の業務執行の決定と取締役の職務の監督を行う機関，執行役は指名委員会等設置会社などで業務執行を担う者です。
    why:
      - 正解です。監査役が取締役の職務の執行を監査します。
      - 取締役会は業務執行の決定や取締役の職務執行の監督を行う機関で，監査役とは役割が異なります。
      - 株主総会は，会社の重要事項を決議する株主の集まりで，監査を担う機関ではありません。
      - 執行役は指名委員会等設置会社などで業務を執行する役職で，監査の機関ではありません。
    terms:
      - 監査役
      - 取締役
  - id: A23-064
    topic: 23-4-5-4
    diff: 2
    q: 消費税のインボイス制度（適格請求書等保存方式）に関する記述として，適切なものはどれか。
    c:
      - インボイス制度は，法人税の計算方法を定めた制度である。
      - 売手は，登録の有無にかかわらず，全ての取引で適格請求書を交付しなければならない。
      - 適格請求書には，消費税額を記載してはならない。
      - 買手が仕入税額控除を受けるには，原則として，登録を受けた事業者が交付する適格請求書（インボイス）などを保存する必要がある。
    a: エ
    exp: |
      インボイス制度では，消費税の仕入税額控除を受けるために，原則として，税務署長の登録を受けた適格請求書発行事業者が交付する適格請求書（インボイス）などの保存が必要です。適格請求書には，登録番号，適用税率，税率ごとに区分した消費税額などを記載します。この制度は消費税の仕組みの一つであり，法人税とは別の税目です。
    why:
      - インボイス制度は消費税に関する制度であり，法人税の計算とは別です。
      - 交付義務を負うのは登録を受けた適格請求書発行事業者であり，未登録の事業者はインボイスを交付できません。
      - 適格請求書には，税率ごとに区分した消費税額などを記載します。
      - 正解です。仕入税額控除には，適格請求書などの保存が原則として必要です。
    terms:
      - インボイス制度
      - 消費税法
  - id: A23-065
    topic: 23-4-5-7
    diff: 2
    q: 無人航空機（ドローン）を飛行させる空域や方法のルールを定めている法律はどれか。
    c:
      - 廃棄物処理法
      - 道路運送車両法
      - 労働安全衛生法
      - 航空法
    a: エ
    exp: |
      航空法は，航空機の安全な運航を確保するための法律で，無人航空機（ドローン）についても，飛行禁止空域，飛行の方法，機体登録などのルールを定めています。小型無人機等飛行禁止法は，国会議事堂や原子力事業所など重要施設の周辺の上空での飛行を禁止する法律で，航空法とは別に適用されます。道路運送車両法は自動車の保安基準などを定める法律です。
    why:
      - 廃棄物処理法は，廃棄物の適正な処理と生活環境の保全を図る法律です。
      - 道路運送車両法は，自動車の登録や保安基準などを定める法律です。
      - 労働安全衛生法は，職場における労働者の安全と健康を確保する法律です。
      - 正解です。航空法が無人航空機の飛行空域や方法のルールを定めています。
    terms:
      - 航空法
      - 小型無人機等飛行禁止法
  - id: A23-066
    topic: 23-4-5-10
    diff: 2
    q: 廃棄物処理法において，事業者が産業廃棄物の処理を許可を受けた処理業者に委託する場合の対応として，適切なものはどれか。
    c:
      - 許可の有無にかかわらず，最も安価な業者に委託する。
      - 処理を委託したので，その後の処理状況の確認は不要である。
      - 産業廃棄物は，他の一般ごみと同じ方法で自治体のごみ収集に出す。
      - 産業廃棄物管理票（マニフェスト）を交付し，最終処分まで適正に処理されたことを確認する。
    a: エ
    exp: |
      廃棄物処理法では，産業廃棄物の処理責任は排出した事業者にあり，処理を他者に委託しても責任はなくなりません。許可を受けた業者と書面で契約し，産業廃棄物管理票（マニフェスト）を交付して，収集運搬から最終処分までが適正に行われたことを確認します。この確認を怠ったり，無許可の業者に委託したりすると，排出事業者も責任を問われます。
    why:
      - 無許可の業者への委託は禁止されています。価格だけで選んではなりません。
      - 委託後も排出事業者が処理責任を負うため，処理状況の確認が必要です。
      - 産業廃棄物は事業活動に伴うもので，一般ごみとして自治体のごみ収集に出すことはできません。
      - 正解です。マニフェストを交付して，最終処分までの適正な処理を確認します。
    terms:
      - 廃棄物処理法
      - マニフェスト
  - id: A23-067
    topic: 23-4-5-11
    diff: 2
    q: 外国為替及び外国貿易法（外為法）に基づく安全保障貿易管理に関する記述として，適切なものはどれか。
    c:
      - 軍事に転用され得る貨物の輸出や技術の提供には，許可が必要となる場合があり，技術の提供には電子メールなどによる情報の送信も含まれ得る。
      - 国内の企業同士の取引にも，輸出許可が必要である。
      - 輸出の規制対象は有形の貨物だけで，技術やソフトウェアの提供は規制の対象外である。
      - 輸出許可は，輸出先の国や取引の相手に関係なく，不要である。
    a: ア
    exp: |
      外為法は，国際的な平和と安全の維持のため，大量破壊兵器や通常兵器の開発などに転用され得る貨物の輸出と技術の提供を規制しています。規制品目に該当する場合は経済産業大臣の許可が必要で，技術の提供には，設計図やソフトウェアの電子メールなどによる送信，外国人への技術の提供も含まれ得ます。貨物だけでなく技術・ソフトウェアも対象になる点に注意が必要です。
    why:
      - 正解です。軍事転用され得る貨物や技術の提供に許可が必要で，電子的な送信も技術の提供になり得ます。
      - 居住者である国内の企業どうしの国内での取引は，輸出許可の対象ではありません。外為法の規制は，外国への貨物の輸出や，外国での技術の提供・非居住者への技術の提供などを対象としています。
      - 技術やソフトウェアの提供も規制の対象となります。
      - 規制品目に該当する貨物や技術では，許可が必要になる場合があります。
    terms:
      - 外為法
      - 安全保障貿易管理
  - id: A23-068
    topic: 23-5-1-2
    diff: 1
    q: ISO（国際標準化機構）の説明として，適切なものはどれか。
    c:
      - 日本国内の工業標準を調査・審議する国の機関
      - 電気通信分野の国際規格を策定する国際連合の専門機関
      - 電気・電子分野の国際規格を策定する国際機関
      - 電気・電子分野を除く幅広い分野の国際規格を策定する，非政府の国際機関
    a: エ
    exp: |
      ISO（International Organization for Standardization）は，電気・電子技術分野を除く幅広い分野の国際規格を策定する非政府の国際機関で，品質マネジメントの ISO 9001 や情報セキュリティの ISO/IEC 27001 などで知られます。電気・電子分野は IEC，電気通信分野は ITU が担当し，ISO と IEC は ISO/IEC として共同で情報技術の規格を作成します。
    why:
      - 日本の工業標準を審議するのは日本産業標準調査会（JISC）です。
      - 電気通信分野の国際規格を策定する国連の専門機関は ITU（国際電気通信連合）です。
      - 電気・電子分野の国際規格を策定するのは IEC（国際電気標準会議）です。
      - 正解です。電気・電子分野を除く国際規格を策定する非政府の国際機関です。
    terms:
      - ISO
      - IEC
  - id: A23-069
    topic: 23-5-3-1
    diff: 2
    q: 共通フレーム（SLCP-JCF）の目的として，最も適切なものはどれか。
    c:
      - ソフトウェアの開発や取引に関わる作業内容や用語を共通化し，発注者と受注者の間の認識の違いを防ぐ。
      - 特定の開発手法（ウォータフォールモデル）の使用を義務付ける。
      - ソフトウェアの品質を数値で測定するための唯一の指標を定める。
      - ソフトウェアの著作権の帰属先を定める。
    a: ア
    exp: |
      共通フレーム（SLCP-JCF）は，ソフトウェアの企画，要件定義，開発，運用，保守から廃棄に至るライフサイクルの作業項目や用語を共通化したもので，国際規格 ISO/IEC 12207 を基にした JIS X 0160 を取引の実務に合わせて拡張しています。作業範囲や用語を共通の物差しにすることで，発注者と受注者の認識の違いによるトラブルを防ぐことを目的とします。IPA の「共通フレーム 2013」は ISO/IEC 12207:2008（JIS X 0160:2012）に整合した版で，IPA は 2021 年に，ISO/IEC/IEEE 12207:2017（JIS X 0160:2021）に合わせた改訂は行わないとしています。
    why:
      - 正解です。作業内容や用語を共通化して，取引の当事者間の認識の違いを防ぎます。
      - 特定の開発モデルを義務付けず，どの開発モデルにも適用できます。
      - 共通フレームは作業項目や用語を定めるもので，品質の測定指標を定めるものではありません。
      - 著作権の帰属は契約で定めるもので，共通フレームが定めるものではありません。
    terms:
      - 共通フレーム
      - JIS X 0160
  - id: A23-070
    topic: 23-5-4
    diff: 2
    q: OMG（Object Management Group）が策定した CORBA の説明として，適切なものはどれか。
    c:
      - 電子メールを送受信するための通信規約
      - ネットワーク上に分散した，異なるプログラム言語や OS で作られたオブジェクト同士が連携するための仕様
      - データベースへの問合せを行うための言語の仕様
      - Web ページを記述するためのマークアップ言語の仕様
    a: イ
    exp: |
      CORBA（Common Object Request Broker Architecture）は，OMG が策定した分散オブジェクト技術の仕様です。ORB（オブジェクトリクエストブローカ）を介して，ネットワーク上に分散した，異なるプログラム言語や OS で作られたオブジェクト同士が互いのメソッドを呼び出して連携できます。Java 向けの分散コンポーネント技術には，EJB（Enterprise JavaBeans）があります。
    why:
      - 電子メールの送受信の通信規約は SMTP などです。
      - 正解です。異なる言語や OS のオブジェクトが ORB を介して連携するための仕様です。
      - データベースへの問合せ言語は SQL です。
      - Web ページを記述する言語は HTML で、W3C などが仕様を策定しています。
    terms:
      - CORBA
      - OMG
  - id: A23-071
    topic: 23-5-6
    diff: 2
    q: 適合性評価の国際的な枠組みにおける認定機関の役割として，適切なものはどれか。
    c:
      - 製品やサービスが規格に適合していることを，認証機関として直接審査して認証する。
      - 認証機関や試験機関などの適合性評価機関が，その業務を行う能力と公平性を備えているかを評価し，認定する。
      - 規格を策定して，国際規格として発行する。
      - 認証を受けた企業に，製品の販売を斡旋する。
    a: イ
    exp: |
      適合性評価は，製品，サービス，マネジメントシステムなどが規格や要求事項に適合しているかを評価する活動で，試験，検査，認証などがあります。これらを行う認証機関や試験機関が，適切な能力と公平性をもつことを評価して認定するのが認定機関です。認定機関が認証機関の信頼性を担保し，その認証結果が国際的に通用する枠組みになっています。
    why:
      - 製品やサービスを審査して認証するのは認証機関の役割です。
      - 正解です。認定機関は，認証機関や試験機関などの能力と公平性を評価して認定します。
      - 国際規格を策定して発行するのは ISO や IEC などの標準化団体です。
      - 販売の斡旋は認定機関の役割ではありません。
    terms:
      - 適合性評価
      - 認定機関
      - 認証機関
