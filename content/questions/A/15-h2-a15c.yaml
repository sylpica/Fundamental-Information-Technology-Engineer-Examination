questions:
  - id: A15-515
    topic: 15-2-14
    diff: 2
    scope: 15-2-14 リリース及び展開管理。全拠点への展開のリスクを抑えるため、一部で先行稼働させる段階的な展開の判断
    prereq: 展開の方式には、全てを一度に切り替える方式と、段階的に切り替える方式があり、後者は問題の早期発見と影響範囲の限定に役立つこと
    q: |
      基幹システムの入れ替えで、全拠点への一斉の切替えはリスクが高いと判断した。そこで、まず 1 拠点だけで新しいシステムを稼働させ、運用上の問題を洗い出して対処してから、残りの拠点へ順に広げる方針にした。この展開の進め方として、適切なものはどれか。
    c:
      - 切替えの失敗に備えたロールバック手順の整備だけに集中する進め方
      - 段階的な展開（パイロット導入を含む展開）
      - 新旧両システムの長期間の並行運用
      - 一斉切替え（ビッグバン展開）
    a: イ
    exp: |
      一部の拠点で先行して稼働させ、問題を洗い出してから順に広げる進め方は、段階的な展開です。リスクの高い一斉切替えに比べ、問題が起きても影響範囲が先行拠点に限られ、得られた知見を残りの拠点の展開に反映できます。展開の計画では、このような展開方式の選択が重要な論点になります。
    why:
      - ロールバックの手順は切り戻しへの備えであり、展開の進め方そのものではありません。
      - 正解です。先行稼働で問題を洗い出してから広げる、段階的な展開です。
      - 並行運用は、新旧の両方を稼働させ続ける方式であり、二重の作業と費用が長期間続きます。本件は、新システムだけを段階的に広げる進め方です。
      - 一斉切替えは、全拠点が同時に影響を受ける進め方であり、本件で避けようとした方法です。
    know: 展開方式の選択は、リスクと影響範囲の観点で行う。先行稼働（パイロット）は、問題の早期発見と知見の横展開のために使われる。
    terms:
      - リリース管理
      - 展開
    verify:
      manual: 全拠点一斉切替えのリスクを避け、1 拠点の先行稼働で問題を洗い出してから順に広げる方針が、段階的な展開に当たることを、一斉切替え・並行運用・ロールバックとの区別から確認した。
  - id: A15-516
    topic: 15-2-4
    diff: 2
    scope: 15-2-4 資産管理。ソフトウェアの導入数とライセンスの保有数の不一致が見つかった場合の、資産管理としての対応の判断
    prereq: 資産管理では、保有するライセンスと実際に導入している数を照合し、過不足を是正すること、ライセンスの不足したままの利用は契約違反になること
    q: |
      ソフトウェア資産の棚卸しで、ある業務ソフトウェアについて、導入している台数が 120 台、保有するライセンスが 100 台分であることが分かった。資産管理としての対応として、最も適切なものはどれか。
    c:
      - ライセンスの不足は法務部門の問題として、資産管理の対象から外す
      - 不足する 20 台分のライセンスを調達し、使われていない導入があれば削除して、記録を実態に合わせる
      - 超過している 20 台分のソフトウェアを、業務への影響を確認せずに直ちに削除する
      - 台帳のライセンス数を 120 に書き換えて、不一致をなくす
    a: イ
    exp: |
      導入数がライセンスを上回る状態は、契約に反する利用であり、是正が必要です。適切な対応は、不足分のライセンスを調達することと、不要な導入を整理することの組合せであり、あわせて台帳の記録を実態と一致させます。業務で使っているソフトウェアを影響の確認なしに削除すると、業務が停止するおそれがあります。
    why:
      - ライセンスの管理は、ソフトウェア資産管理の中心的な対象であり、対象から外すことはできません。
      - 正解です。不足分の調達と不要な導入の整理で、実態と契約を一致させます。
      - 業務への影響を確認しない削除は、業務の停止を招くおそれがあり、不適切です。
      - 台帳の数字だけを書き換えても、契約違反の状態は解消されません。
    know: 資産管理の照合で見つかった不一致は、「実態・契約・記録」の三つを一致させることで是正する。記録の改ざんや無確認の削除は、いずれも是正にならない。
    terms:
      - 資産管理
      - ライセンス
    verify:
      manual: 導入 120 台・保有ライセンス 100 台分という不一致に対し、不足分の調達と不要な導入の整理で是正する選択肢が最も適切であることを、無確認の削除・記録の書換え・対象外とする対応との比較から確認した。
  - id: A15-517
    topic: 15-2-16
    diff: 2
    scope: 15-2-16 サービス要求管理。障害ではなく定型的な依頼であるサービス要求と、インシデントとの区別の判断
    prereq: パスワードのリセットやアカウントの作成のような、利用者からの定型的な依頼はサービス要求であり、サービスの障害であるインシデントとは分けて管理すること
    q: |
      サービスデスクに、「パスワードを忘れたのでリセットしてほしい」「新しい担当者用のアカウントを作ってほしい」といった依頼が数多く寄せられている。これらは障害の申告ではない。サービス要求管理としての対応として、最も適切なものはどれか。
    c:
      - 全てインシデントとして記録し、影響度と緊急度で優先順位を付けて対応する
      - 定型的な依頼として手順を標準化し、承認の流れを定めて、迅速に処理できるようにする
      - 依頼の受付をやめ、利用者が自分で処理できるようにだけ案内する
      - 依頼の処理は各担当者の判断に任せ、手順は定めない
    a: イ
    exp: |
      パスワードのリセットやアカウントの作成は、障害ではなく、あらかじめ定められたサービスへの定型的な依頼（サービス要求）です。サービス要求管理では、手順と承認の流れを標準化し、迅速に処理できるようにすることで、利用者の待ち時間と担当者の負担の両方を減らします。サービス要求も記録して優先度を付けますが、サービスの中断や品質の低下として扱うインシデントとは区別して管理します。
    why:
      - インシデントはサービスの中断や品質の低下を扱うものです。障害でない定型の依頼をすべてインシデントとして記録すると、障害の件数や傾向が正しく把握できなくなります。サービス要求も記録して優先度を付けますが、インシデントとは区別して扱います。
      - 正解です。定型的な依頼は、手順の標準化によって迅速に処理します。
      - アカウントの作成など、利用者自身では行えない依頼もあり、受付をやめることはできません。
      - 手順を定めないと、処理の速さと正確さが担当者ごとにばらつき、依頼の滞留を招きます。
    know: サービス要求とインシデントの区別は、サービスデスクの入口の設計の要点である。どちらも記録して優先度を付けるが、定型の依頼は手順の標準化で迅速に実現し、障害は回避策も使って速やかに回復させる。
    terms:
      - サービス要求
      - サービスデスク
    verify:
      manual: パスワードのリセットやアカウント作成のような定型的な依頼がサービス要求であり、手順と承認の標準化によって扱う選択肢が最も適切であることを、インシデントとしての優先付けとの区別から確認した。
  - id: A15-518
    topic: 15-2-18
    diff: 3
    scope: 15-2-18 サービス可用性管理。負荷分散された 2 台構成（どちらか一方で継続できる並列構成）の稼働率を求め、合意したサービス時間に対する停止時間の期待値に換算する問題であり、範囲内。
    prereq: 並列の構成の稼働率は、両方が同時に止まる確率を 1 から引いて求めること、停止時間は（1 － 稼働率）× サービス時間で求めること
    hard: 片方で継続できる構成では、停止するのは 2 台が同時に止まるときだけであることを読み取り、停止率の積を求めてからサービス時間に換算する 2 段階の計算が必要である。直列の式や、停止率を台数で割る誤りを誘う。
    q: |
      あるサービスは、稼働率 0.95 のサーバ 2 台で負荷を分散する構成であり、どちらか一方のサーバが稼働していれば、サービスを継続できる。2 台の故障は互いに独立であるものとする。サービス時間が 1 か月に 43,200 分（24 時間・30 日）であるとき、1 か月のサービスの停止時間の期待値は何分か。
    c:
      - '108'
      - '1,080'
      - '2,160'
      - '4,212'
    a: ア
    exp: |
      サービスが止まるのは、2 台が同時に止まるときだけです。

      1 台の停止率 ＝ 1 － 0.95 ＝ 0.05
      2 台が同時に止まる確率 ＝ 0.05 × 0.05 ＝ 0.0025
      停止時間の期待値 ＝ 43,200 × 0.0025 ＝ 108 分

      サービスの稼働率は 1 － 0.0025 ＝ 0.9975 です。1 台だけなら停止時間は 43,200 × 0.05 ＝ 2,160 分なので、冗長化によって停止時間は 20 分の 1 になります。
    why:
      - 正解です。2 台が同時に止まる確率 0.0025 に、サービス時間 43,200 分を掛けた値です。
      - 1 台の停止率 0.05 を台数の 2 で割って 0.025 とした値です。並列構成の停止率は、割り算ではなく停止率の積 0.05 × 0.05 で求めます。
      - 1 台分の停止率 0.05 による値です。冗長化の効果を計算に入れていません。
      - 両方が稼働して初めて継続できる直列構成として、1 － 0.95 × 0.95 ＝ 0.0975 を停止率とした値です。本問は片方の稼働で継続できます。
    know: 片方で継続できる並列構成の停止率は「各停止率の積」、両方が必要な直列構成の稼働率は「各稼働率の積」で求める。SLA の評価では、稼働率を合意したサービス時間に掛けて停止時間に換算すると、目標との比較がしやすい。
    terms:
      - 稼働率
      - 冗長化
    verify:
      value: 43200 * (1 - 0.95) ** 2
      tolerance: 0.000001
  - id: A15-519
    topic: 15-3-1-2
    diff: 2
    scope: 15-3-1-2 サービスの報告。顧客への定期的なサービス報告に含めるべき内容の判断
    prereq: サービスの報告では、合意した水準の達成状況に加え、傾向や改善の取組を伝え、顧客との改善の対話につなげること
    q: |
      提供しているサービスについて、顧客への月次の報告を行う。サービス報告の内容として、最も適切なものはどれか。
    c:
      - システムの内部の監視項目の数値を、そのまま全て示す
      - SLA の達成状況、障害の傾向、実施した改善と今後の改善計画を示す
      - 当月に発生した障害の一覧だけを示す
      - 請求金額の内訳だけを示す
    a: イ
    exp: |
      サービス報告は、合意したサービスレベルの達成状況を顧客と確認し、改善につなげるためのものです。達成状況に加えて、障害の傾向、実施した改善、今後の計画を示すことで、顧客はサービスの状態と今後の見通しを判断できます。内部の監視数値の羅列や、金額の内訳だけでは、その役割を果たしません。
    why:
      - 内部の監視数値は、顧客にとって意味のある形に整理して示す必要があります。
      - 正解です。達成状況・傾向・改善を含む報告が、確認と改善の対話につながります。
      - 障害の一覧だけでは、水準全体の達成状況や、今後の改善の見通しが伝わりません。
      - 請求の内訳は会計の情報であり、サービスの報告とは目的が異なります。
    know: サービス報告の役割は、「合意した水準が守れたか」と「次に何を改善するか」を顧客と共有することである。内部データの羅列は報告にならない。
    terms:
      - サービス報告
      - SLA
    verify:
      manual: 月次のサービス報告に、SLA の達成状況・障害の傾向・実施した改善と今後の計画を含める選択肢が最も適切であることを、障害一覧のみ・監視数値の羅列・請求内訳のみとの比較から確認した。
  - id: A15-520
    topic: 15-2-9
    diff: 2
    scope: 15-2-9 サービスの予算業務及び会計業務。共通サービスの費用を、部門ごとの利用量に応じて配賦する計算
    prereq: 費用の配賦では、全体の費用を配賦の基準（利用量の比率）に応じて分けること
    q: |
      共通の情報システムにかかる年間の費用は 120 万円である。この費用を、部門 A、B、C の利用量の比 5 対 3 対 2 に応じて配賦する。部門 A に配賦される金額は幾らか。
    c:
      - 24 万円
      - 60 万円
      - 36 万円
      - 40 万円
    a: イ
    exp: |
      利用量の比の合計は 5 ＋ 3 ＋ 2 ＝ 10 であり、部門 A の割合は 10 分の 5、すなわち半分です。120 万円の半分は 60 万円であり、部門 A への配賦額は 60 万円となります。なお、部門 B は 36 万円、部門 C は 24 万円であり、合計すると 120 万円に戻ります。
    why:
      - 部門 C への配賦額（120 × 2 ÷ 10）です。部門 A の割合は 10 分の 5 です。
      - 正解です。比率の合計 10 に対する 5 の割合で、120 万円の半分です。
      - 部門 B への配賦額（120 × 3 ÷ 10）です。部門 A の比は 5 です。
      - 利用量の比を使わず、3 部門で均等に割った値（120 ÷ 3）です。配賦は利用量の比 5 対 3 対 2 に応じて行います。
    know: 費用の配賦の計算は、「比率の合計に対する自部門の割合」を全体の費用に掛けることが基本である。検算として、各部門の配賦額の合計が全体に戻ることを確認するとよい。
    terms:
      - 配賦
    verify:
      value: 120 * 5 / (5 + 3 + 2)
  - id: A15-521
    topic: 15-2-8
    diff: 2
    scope: 15-2-8 供給者管理。外部の供給者のサービスについて、水準の達成状況を定期的に評価し、是正につなげる活動の判断
    prereq: 供給者管理では、契約で合意した水準の達成状況を定期的に評価し、未達があれば是正を求めること
    q: |
      外部供給者に運用を委託しているサービスで、月次の障害対応の実績が、契約で合意した水準を 3 か月続けて下回っている。供給者管理としての対応として、最も適切なものはどれか。
    c:
      - 合意した水準の方を、実績に合わせて引き下げる
      - 直ちに契約を解除し、別の供給者に切り替える
      - 水準の下回りは供給者の責任として、自社では何も対応しない
      - 達成状況を供給者と確認し、原因の分析と是正の計画を求め、改善の経過を評価する
    a: エ
    exp: |
      供給者管理では、合意した水準の達成状況を定期的に評価し、未達が続く場合は、原因の分析と是正の計画を求めて、改善を確認します。契約を結ぶだけでなく、継続的に評価と是正の働きかけを行うことが管理の要点です。即時の契約解除は、サービスの継続自体を危うくし、水準の引下げは、顧客との合意したサービスレベルを損ないます。
    why:
      - 実績に合わせて水準を引き下げると、顧客との合意した水準を満たせなくなります。
      - 是正の機会を与えずに切り替えると、移行の混乱でサービスの継続が危うくなります。
      - 責任が供給者にあっても、自社のサービスとしての水準は自社が顧客に約束したものであり、無対応は不適切です。
      - 正解です。評価と是正の要求、改善の確認が、供給者管理の進め方です。
    know: 供給者管理は「契約して終わり」ではなく、達成状況の定期的な評価と、是正の働きかけの繰り返しである。自社の SLA は、委託先の事情では下がらない。
    terms:
      - 供給者管理
    verify:
      manual: 合意した水準を 3 か月下回る供給者に対し、達成状況の確認・原因分析と是正計画の要求・改善の評価を行う選択肢が最も適切であることを、無対応・即時の解除・水準の引下げとの比較から確認した。
  - id: A15-522
    topic: 15-2-3
    diff: 2
    scope: 15-2-3 サービスカタログ管理。サービスカタログに記載する情報の範囲と、変更に応じた更新の判断
    prereq: サービスカタログは、利用者が注文できるサービスと、その内容・水準・申込みの手続をまとめたものであり、サービスの変更に合わせて最新の状態に保つこと
    q: |
      新しいサービスが提供開始になったが、サービスカタログへの追加が漏れていて、利用者からの申込みが旧来の窓口に集まって混乱した。サービスカタログ管理として、最も適切なものはどれか。
    c:
      - 提供中のサービスの内容、水準、申込みの手続をカタログに記載し、サービスの開始や変更の都度、漏れなく更新する
      - カタログは内部の担当者だけが参照するものとし、利用者には公開しない
      - カタログは年に一度まとめて更新すればよい
      - カタログには、サーバやソフトウェアの構成情報の詳細を記載する
    a: ア
    exp: |
      サービスカタログは、利用者が「どのサービスを、どのような内容と水準で、どう申し込めるか」を知るための情報です。サービスの開始や変更の都度、漏れなく更新して最新の状態に保つことが、カタログ管理の要点です。構成情報の詳細は、構成管理データベース（CMDB）の領域です。
    why:
      - 正解です。利用者向けのサービスの情報として、開始や変更の都度更新します。
      - カタログは、利用者がサービスを選んで申し込むためのものであり、利用者への公開が前提です。
      - 年に一度の更新では、開始や変更に追いつかず、本件のような漏れが繰り返されます。
      - 構成情報の詳細は CMDB の内容であり、利用者が注文するためのカタログの情報ではありません。
    know: サービスカタログは「利用者のための注文案内」、CMDB は「内部の構成記録」という役割の違いが要点である。カタログは、サービスの変更と連動して更新する。
    terms:
      - サービスカタログ
      - CMDB
    verify:
      manual: 新サービスの追加漏れという事例に対し、サービスの内容・水準・申込み手続をカタログに記載し開始や変更の都度更新する選択肢が最も適切であることを、CMDB の内容・年次更新・非公開との区別から確認した。
