questions:
  - id: A22-525
    topic: 22-3-1-1
    diff: 3
    scope: 22-3-1-1 販売ミックスの損益分岐点。2 製品の販売比率を 1 セットとしてまとめ、セット当たりの貢献利益から損益分岐点のセット数を求め、製品 A の個数に換算する問題
    prereq: 貢献利益は単価から変動費を差し引いたものであること、販売比率が一定に保たれるなら、製品の組合せを 1 セットとして、セット当たりの貢献利益で損益分岐点を計算できること
    hard: 製品が 2 つあるため、セット当たりの貢献利益を組み立てる一段目と、求めたセット数を製品の個数に換算する二段目の、両方が必要である。セット数と製品個数の取り違えが見分けの中心になる。
    q: |
      製品 A と製品 B が、常に 2 対 1 の個数の比率で販売されている。製品 A の単価は 3,000 円、1 個当たりの変動費は 1,800 円である。製品 B の単価は 2,000 円、1 個当たりの変動費は 1,400 円である。固定費は 540 万円である。損益分岐点における製品 A の販売数量は何個か。
    c:
      - 4,500
      - 1,800
      - 3,600
      - 5,400
    a: ウ
    exp: |
      販売比率が一定の場合は、製品の組合せを 1 セットとして考えます。A を 2 個と B を 1 個で 1 セットとすると、1 セット当たりの貢献利益は、

      A の貢献利益 ＝ 3,000 － 1,800 ＝ 1,200 円
      B の貢献利益 ＝ 2,000 － 1,400 ＝ 600 円
      1 セット当たり ＝ 1,200 × 2 ＋ 600 × 1 ＝ 3,000 円

      損益分岐点のセット数 ＝ 540 万円 ÷ 3,000 円 ＝ 1,800 セット。製品 A は 1 セットに 2 個含まれるため、A の販売数量は 1,800 × 2 ＝ 3,600 個です。
    why:
      - 製品 B の貢献利益を無視し、製品 A の貢献利益だけで固定費をまかなうとした場合の値です（540 万円 ÷ 1,200 円）。販売ミックスでは、両製品の貢献を合わせて考えます。
      - 損益分岐点のセット数そのものです。問われているのは製品 A の個数であり、1 セットに A が 2 個含まれるため、その 2 倍になります。
      - 正解です。セット数 1,800 に、1 セット当たりの A の個数 2 を掛けた値です。
      - 製品 A と製品 B を合わせた、全製品の合計個数（1,800 セット × 3 個）です。問われているのは製品 A の個数だけです。
    know: 複数製品の損益分岐は、販売ミックスを「セット（束）」として 1 単位にまとめ、セット当たりの貢献利益で固定費を割ることが基本である。最後に、答えの単位がセット数なのか製品の個数なのかを確認する点が要点である。
    terms:
      - 損益分岐点
      - 限界利益
    verify:
      value: 5400000 / ((3000 - 1800) * 2 + (2000 - 1400)) * 2
  - id: A22-526
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 当座比率。流動資産から棚卸資産と前払金を除いた当座資産を組み立てて計算する問題
    prereq: 当座資産は、現金預金や売掛金など換金の確実な資産であり、棚卸資産だけでなく前払金（代金の前渡しで、将来は商品などを受け取るもので現金では回収しない）も除くこと
    hard: 当座資産から除くのは棚卸資産だけではない。前払金は代金を前渡しした分で、将来は商品などの引渡しを受けるものであり現金に戻る資産ではないため、含めてしまうと比率が見かけ上良くなる点が問われる。
    q: |
      流動資産は 1,200 万円で、その内訳は、現金預金 300 万円、売掛金 400 万円、棚卸資産 350 万円、前払金 150 万円である。流動負債は 500 万円である。当座比率は何％か。
    c:
      - '240'
      - '140'
      - '170'
      - '210'
    a: イ
    exp: |
      当座比率 ＝ 当座資産 ÷ 流動負債 です。当座資産は、流動資産のうち換金の確実なものだけであり、棚卸資産（売れるか分からない）と前払金（代金の前渡し分で、将来は商品などを受け取るものであり、現金では回収しない）を除きます。

      当座資産 ＝ 1,200 － 350 － 150 ＝ 700 万円
      当座比率 ＝ 700 ÷ 500 ＝ 1.4、すなわち 140 ％

      流動資産をそのまま使うと 240 ％（流動比率）となり、実態より良く見えてしまいます。
    why:
      - 流動資産をそのまま分子にした流動比率の値です。当座比率では、棚卸資産と前払金を除きます。
      - 正解です。当座資産 700 万円 ÷ 流動負債 500 万円で、140 ％です。
      - 棚卸資産だけを除いた場合の値（当座資産 850 万円）です。前払金も、現金ではなく商品などの引渡しで決済されるため当座資産には含まれません。
      - 前払金だけを除いた場合の値（当座資産 1,050 万円）です。棚卸資産も、換金の確実性が低いため除きます。
    know: 当座比率の分子は「すぐに現金化できる資産」であり、判定は換金の確実性で行う。棚卸資産と前払金という 2 種類の「流動だが当座でない」資産を除く点が要点である。
    terms:
      - 当座比率
    verify:
      value: (1200 - 350 - 150) / 500 * 100
  - id: A22-527
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 自己資本利益率（ROE）と期中平均の自己資本。期首と期末の自己資本の平均を使って計算する問題
    prereq: ROE の分母の自己資本は、期中の増減をならした期中平均（期首と期末の平均）を用いること、総資本（総資産）で割る指標は ROA であること
    hard: 期末の値だけを使うのではなく、平均を取る一段の手順が解法の核心である。期首・期末・総資本という 3 つの分母の取り違えを切り分ける必要がある。
    q: |
      当期純利益は 160 万円、自己資本は期首が 700 万円、期末が 900 万円、総資本（総資産）は 2,000 万円である。自己資本利益率（ROE）は何％か。ここで、自己資本は期中平均を用いるものとする。
    c:
      - '8'
      - '17.8'
      - '22.9'
      - '20'
    a: エ
    exp: |
      ROE ＝ 当期純利益 ÷ 自己資本（期中平均） です。自己資本の期中平均は、

      （700 ＋ 900）÷ 2 ＝ 800 万円

      ROE ＝ 160 ÷ 800 ＝ 0.2、すなわち 20 ％

      期中の利益は期間を通じて積み上がるため、分母の資本も期間の平均で捉えるのが対応の取れた計算です。なお、総資本で割る 160 ÷ 2,000 ＝ 8 ％は、総資本利益率（ROA）であり、ROE とは分母が異なります。
    why:
      - 総資本を分母にした総資本利益率（ROA）の値です。ROE の分母は自己資本です。
      - 期末の自己資本だけを分母にした場合の値（160 ÷ 900 ≒ 17.8）です。ROE では期中平均を用います。
      - 期首の自己資本だけを分母にした場合の値（160 ÷ 700 ≒ 22.9）です。分母は期中平均です。
      - 正解です。期中平均の自己資本 800 万円に対して、20 ％です。
    know: ROE の分母は期中平均の自己資本である。期間のフロー（利益）と時点のストック（資本）を対応させるため平均を取ることが、財務指標の計算の要点である。
    terms:
      - ROE
      - 自己資本
    verify:
      value: 160 / ((700 + 900) / 2) * 100
  - id: A22-528
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 棚卸資産回転率。期首と期末の棚卸資産の平均と売上原価から、棚卸資産が 1 年に何回入れ替わるかを計算する問題
    prereq: 棚卸資産回転率は売上原価 ÷ 平均棚卸資産であり、分子は売上高ではなく売上原価を使うこと、平均棚卸資産は期首と期末の平均であること
    hard: 分母に期首・期末の平均を用いる段階と、売上総利益率から求まる売上高ではなく売上原価を分子に使う判断の両方が必要になる。期首だけ・期末だけ・売上高を使う誤りがそれぞれ別の値になる。
    q: |
      年間の売上原価は 1,200 万円、売上総利益率は 25 ％である。棚卸資産は期首が 100 万円、期末が 200 万円である。棚卸資産として期首と期末の平均を用いるとき、棚卸資産回転率は何回か。
    c:
      - '6'
      - '8'
      - '10.7'
      - '12'
    a: イ
    exp: |
      棚卸資産回転率は、売上原価を平均棚卸資産で割ります。
      - 平均棚卸資産 ＝ （100 ＋ 200） ÷ 2 ＝ 150 万円
      - 棚卸資産回転率 ＝ 1,200 ÷ 150 ＝ 8 回
      売上総利益率から売上高を求めると 1,200 ÷ （1 － 0.25）＝ 1,600 万円となりますが、回転率の分子は売上原価のほうを使います。なお、回転期間に直すと 365 ÷ 8 ＝ 約 46 日です。
    why:
      - 期末の棚卸資産 200 万円だけを分母にした値（1,200 ÷ 200）です。分母は期首と期末の平均 150 万円です。
      - 正解です。売上原価 1,200 万円 ÷ 平均棚卸資産 150 万円で 8 回です。
      - 分子に売上高 1,600 万円を使った場合の値（1,600 ÷ 150）です。回転率の分子は売上原価です。
      - 期首の棚卸資産 100 万円だけを分母にした値（1,200 ÷ 100）です。分母は期首と期末の平均 150 万円です。
    know: 在庫の回転率は、原価ベースで測るのが原則である。売上高を使うと、利益率の分だけ実態より速く見える。期中に在庫が増減するときは、期首と期末の平均を分母に用いる。
    terms:
      - 棚卸資産回転率
    verify:
      value: 1200 / ((100 + 200) / 2)
  - id: A22-529
    topic: 22-3-5
    diff: 2
    scope: 22-3-5 資産管理の減価償却。期中に取得した設備について、定額法の年間償却額を使用月数で月割りして、取得した期の減価償却費を求める問題
    prereq: 定額法の年間償却額 ＝ （取得価額 − 残存価額） ÷ 耐用年数、期中に取得した場合は使用を開始した月から決算月までの月数で月割りすること
    q: |
      取得価額 120 万円の設備を 10 月 1 日に取得し、同日から使用を開始した。この設備を耐用年数 5 年、残存価額 0 円の定額法で減価償却する。決算日が 3 月 31 日（1 年決算）で、取得した期の減価償却費を月割りで計算するとき、その額は何万円か。
    c:
      - '12'
      - '24'
      - '14'
      - '6'
    a: ア
    exp: |
      まず年間の償却額を求め、使用した月数で月割りします。
      - 年間の償却額 ＝ （120 − 0） ÷ 5 ＝ 24 万円
      - 取得した期の使用月数は、10 月から 3 月までの 6 か月
      - 減価償却費 ＝ 24 × 6 ÷ 12 ＝ 12 万円
      期の途中で取得した資産は、その期には使用した期間の分だけ費用にします。翌期からは 1 年分の 24 万円ずつ償却します。
    why:
      - 正解です。年間 24 万円を 6 か月分に月割りして 12 万円です。
      - 月割りをせず、1 年分の償却額をそのまま計上した値です。取得した期は使用した 6 か月分だけを計上します。
      - 10 月から 3 月までを 7 か月と数えた値（24 × 7 ÷ 12）です。10・11・12・1・2・3 月の 6 か月です。
      - 12 月までの 3 か月分だけを計上した値（24 × 3 ÷ 12）です。決算日は 3 月 31 日なので、1 月から 3 月までも当期に含みます。
    know: 定額法は毎年同額を償却する方法で、期中取得の資産は初年度だけ使用月数で月割りする。定率法は期首帳簿価額に償却率を掛けるため、償却額が年々減る点が定額法と異なる。
    terms:
      - 減価償却
      - 定額法
    verify:
      value: (120 - 0) / 5 * 6 / 12
  - id: A22-530
    topic: 22-2-1-1
    diff: 3
    scope: 22-2-1-1 線形計画法。2 製品の利益と 3 つの制約（材料・労働・市場の需要上限）から、実行可能な領域の頂点を評価して最大利益を求める問題
    prereq: 線形計画法の最適解は、制約が作る実行可能領域の頂点のいずれかに現れること
    hard: 材料と労働の 2 つの制約の交点が需要上限の制約を満たさないため、その点を候補から外し、需要上限の直線と労働の制約の交点を新たな頂点として求め直す必要がある。
    q: |
      製品 X は 1 個当たり 5 万円、製品 Y は 1 個当たり 4 万円の利益がある。生産量を x、y（いずれも 0 以上）とすると、材料の制約は 2x ＋ y ≦ 100、労働の制約は x ＋ 2y ≦ 80 であり、さらに製品 X は市場の需要から x ≦ 30 とする。利益を最大にする生産量の組合せでの、最大利益は何万円か。
    c:
      - '280'
      - '250'
      - '160'
      - '150'
    a: イ
    exp: |
      実行可能領域の頂点を求め、各頂点で利益 5x ＋ 4y を評価します。材料と労働の制約の交点 （40, 20） は x ≦ 30 を満たさないので、頂点になりません。
      - （0, 40）（労働の制約と y 軸の交点）：利益 ＝ 160 万円
      - （30, 25）（x ＝ 30 と労働の制約 x ＋ 2y ＝ 80 の交点。材料は 2 × 30 ＋ 25 ＝ 85 ≦ 100 で満たす）：利益 ＝ 5 × 30 ＋ 4 × 25 ＝ 250 万円
      - （30, 0）：利益 ＝ 150 万円
      最大利益は 250 万円で、組合せは （30, 25） です。
    why:
      - 需要上限 x ≦ 30 を無視して、材料と労働の制約の交点 （40, 20） で評価した値（5 × 40 ＋ 4 × 20）です。x ＝ 40 は需要上限を超えます。
      - 正解です。x ＝ 30 と労働の制約の交点 （30, 25） で利益 250 万円が最大です。
      - Y だけを生産する頂点 （0, 40） の利益です。X を組み合わせた頂点のほうが大きくなります。
      - X を需要上限の 30 個だけ生産する頂点 （30, 0） の利益です。労働に余裕があるので Y も生産できます。
    know: 線形計画法は、頂点の列挙と評価が手順の中心である。制約が増えると、2 つの制約の交点が別の制約に反して頂点でなくなることがあるので、候補の点がすべての制約を満たすかを必ず確かめる。
    terms:
      - 線形計画法
    verify:
      value: (() => { let m = 0; for (let x = 0; x <= 100; x++) for (let y = 0; y <= 100; y++) if (2 * x + y <= 100 && x + 2 * y <= 80 && x <= 30) m = max(m, 5 * x + 4 * y); return m; })()
  - id: A22-531
    topic: 22-2-1-2
    diff: 2
    scope: 22-2-1-2 発注点と安全在庫。1日の最大使用量と平均使用量、リードタイムから、安全在庫を求めた上で発注点を計算する問題
    prereq: 安全在庫は（最大使用量 － 平均使用量）× リードタイム、発注点は平均使用量 × リードタイム ＋ 安全在庫であること
    q: |
      ある部品の 1 日の平均使用量は 40 個、最大使用量は 55 個、調達のリードタイムは 5 日である。安全在庫を（最大使用量 − 平均使用量）× リードタイムで見積もるとき、発注点は何個か。
    c:
      - '200'
      - '275'
      - '350'
      - '215'
    a: イ
    exp: |
      まず、安全在庫を求めます。

      安全在庫 ＝ （最大使用量 － 平均使用量）× リードタイム
      ＝ （55 － 40）× 5
      ＝ 75 個

      発注点 ＝ 平均使用量 × リードタイム ＋ 安全在庫
      ＝ 40 × 5 ＋ 75
      ＝ 275 個

      間違えやすいのは、安全在庫まで最大使用量で計算してしまう点と、発注点の本体に最大使用量を使う点です。本体は平均の見込みで、安全在庫は「平均を超える振れ」への備えとして分けて計算します。
    why:
      - 安全在庫を含めず、平均使用量 × リードタイムだけを計算した値です。発注点には安全在庫を加えます。
      - 正解です。200 ＋ 75 ＝ 275 個です。
      - 発注点の本体にも最大使用量を使った場合の値（55 × 5 ＋ 75 ＝ 350 個）です。本体は平均使用量（40 × 5 ＝ 200 個）で求めます。
      - 安全在庫を、最大使用量と平均使用量の 1 日分の差 15 個だけとした値（200 ＋ 15）です。差はリードタイムの 5 日分見込みます。
    know: 発注点の計算は、安全在庫の分だけ「平均の見込み」から上乗せする構造である。最大使用量は安全在庫の計算にだけ使う点が要点である。
    terms:
      - 発注点
      - 安全在庫
    verify:
      value: 40 * 5 + (55 - 40) * 5
  - id: A22-532
    topic: 22-3-3
    diff: 3
    scope: 22-3-3 キャッシュフロー会計。間接法による営業キャッシュフロー。税引前利益に、非資金項目と運転資本の増減（棚卸資産・売上債権・仕入債務）を調整して求める問題
    prereq: 間接法では、減価償却費のような非資金の費用を加え戻し、資産の増加は資金の減少、資産の減少と負債の増加は資金の増加として調整すること
    hard: 調整項目が 4 つあり、符号の向きが項目ごとに異なる。特に「棚卸資産の減少は資金の増加」「仕入債務の減少は資金の減少」という、在庫と買掛金の向きの判断が問われる。
    q: |
      間接法で営業活動によるキャッシュフローを計算する。税引前当期純利益は 250 万円、減価償却費は 60 万円、棚卸資産は 30 万円減少し、売上債権は 50 万円増加し、仕入債務は 20 万円減少した。営業活動によるキャッシュフローは何万円か。
    c:
      - '310'
      - '150'
      - '210'
      - '270'
    a: エ
    exp: |
      税引前当期純利益に、資金の動きを伴わない項目と、運転資本の増減を調整します。

      - 減価償却費（非資金の費用）: ＋60 万円
      - 棚卸資産の減少（在庫が資金に戻った）: ＋30 万円
      - 売上債権の増加（売上がまだ入金されていない）: －50 万円
      - 仕入債務の減少（買掛金を支払った）: －20 万円

      営業活動によるキャッシュフロー ＝ 250 ＋ 60 ＋ 30 － 50 － 20 ＝ 270 万円

      利益と資金の動きはずれるため、この調整が間接法の中心です。
    why:
      - 仕入債務の減少を、資金の増加として加えてしまった場合の値です。買掛金の減少は支払いであり、資金は減ります。
      - 減価償却費を加え戻す代わりに差し引いてしまった場合の値です。減価償却費は資金の支出を伴わない費用であり、加え戻します。
      - 棚卸資産の減少を、資金の減少として差し引いてしまった場合の値です。在庫の減少は、資金が戻ったことを意味します。
      - 正解です。非資金項目の加え戻しと、運転資本の増減の調整を全て行った値です。
    know: 間接法の調整は、「資産の増減は資金と逆向き、負債の増減は資金と同じ向き」という一つの規則で整理できる。項目の数が増えても、この規則で符号を決めることが要点である。
    terms:
      - キャッシュフロー計算書
      - 間接法
    verify:
      value: 250 + 60 + 30 - 50 - 20
