questions:
  - id: A22-517
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 財務会計と管理会計の財務指標。付加価値を売上高から外部購入価値を控除して求め、人件費の合計との比である労働分配率を計算する問題
    prereq: 付加価値は売上高から外部購入価値を引いたもの、人件費は売上原価の労務費と販管費の人件費の合計であること
    hard: 付加価値の計算で売上原価と販管費の両方から外部購入分だけを差し引くことと、人件費に両方の人件費を含めることの両方が必要になる。付加価値を売上総利益で代用すると別の値になる。
    q: |
      ある会社の当期の数値は次のとおりである。労働分配率は何％か。

      - 売上高： 12,000 万円
      - 売上原価： 7,200 万円（うち労務費 1,600 万円、残りは材料費などの外部購入価値）
      - 販売費及び一般管理費： 2,800 万円（うち人件費 1,400 万円、残りは外部購入価値）
    c:
      - '25'
      - '60'
      - '62.5'
      - '32'
    a: イ
    exp: |
      労働分配率 ＝ 人件費 ÷ 付加価値 です。付加価値は、売上高から外部から購入した価値を差し引いて求めます。
      - 外部購入価値 ＝ 売上原価の 7,200 − 1,600 ＝ 5,600 万円 ＋ 販管費の 2,800 − 1,400 ＝ 1,400 万円 ＝ 7,000 万円
      - 付加価値 ＝ 12,000 － 7,000 ＝ 5,000 万円
      - 人件費 ＝ 労務費 ＋ 販管費の人件費 ＝ 1,600 ＋ 1,400 ＝ 3,000 万円
      - 労働分配率 ＝ 3,000 ÷ 5,000 ＝ 0.6、すなわち 60 ％
    why:
      - 人件費を売上高で割った値（3,000 ÷ 12,000）です。労働分配率の分母は付加価値です。
      - 正解です。付加価値 5,000 万円に対して人件費 3,000 万円で、60 ％です。
      - 売上総利益（12,000 − 7,200 ＝ 4,800 万円）を付加価値とみなした値（3,000 ÷ 4,800）です。売上総利益は売上原価の労務費まで差し引いており、販管費の外部購入価値は差し引いていないので、付加価値とは異なります。
      - 売上原価の労務費 1,600 万円だけを人件費とした値（1,600 ÷ 5,000）です。販管費に含まれる人件費 1,400 万円も人件費に含めます。
    know: 労働分配率は、企業が生み出した付加価値のうち人件費に配分された割合。付加価値の計算（外部購入価値の控除）と人件費の範囲（製造・販管の両方）を正しく押さえることが要点で、売上総利益や売上高を分母に使うのは誤りである。
    terms:
      - 労働分配率
      - 付加価値
    verify:
      value: (1600 + 1400) / (12000 - (7200 - 1600) - (2800 - 1400)) * 100
  - id: A22-518
    topic: 22-3-2
    diff: 2
    scope: 22-3-2 財務会計と管理会計の安全性指標。事業利益と支払利息から、利息の支払能力を測るインタレスト・カバレッジ・レシオを計算する問題
    prereq: インタレスト・カバレッジ・レシオは（営業利益 ＋ 受取利息・配当金）÷ 支払利息で定義されること
    q: |
      ある会社の営業利益は 480 万円、受取利息及び配当金は 60 万円、支払利息は 60 万円である。インタレスト・カバレッジ・レシオは何倍か。
    c:
      - '7'
      - '9'
      - '8'
      - '10'
    a: イ
    exp: |
      インタレスト・カバレッジ・レシオ ＝ 事業利益 ÷ 金融費用（支払利息）です。事業利益は、営業利益に受取利息・配当金を加えたものです。

      (480 ＋ 60) ÷ 60 ＝ 540 ÷ 60 ＝ 9 倍

      分子が営業利益だけ（480 万円）だと 8 倍になり、定義より小さく出ます。受取利息・配当金は、本業以外から得る金融収益として事業利益に含めるのが、この指標の定義です。
    why:
      - 受取利息・配当金を加えるべきところを差し引いた値（（480 − 60） ÷ 60）です。受取利息・配当金は事業利益に加えます。
      - 正解です。事業利益 540 万円 ÷ 支払利息 60 万円 ＝ 9 倍です。
      - 営業利益だけを分子にした場合の値（480 ÷ 60）です。受取利息・配当金も事業利益に含めます。
      - 分子に支払利息まで加えた値（600 ÷ 60）です。支払利息は分母の側の量です。
    know: インタレスト・カバレッジ・レシオは、事業で得た利益（事業利益）が利息の何倍あるかを示し、大きいほど利息の支払いに余裕がある。分子は営業利益だけでなく受取利息・配当金を含む点が定義の要点である。
    terms:
      - インタレスト・カバレッジ・レシオ
    verify:
      value: (480 + 60) / 60
  - id: A22-519
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 財務会計と管理会計の財務指標。平均棚卸資産と年間売上原価から、棚卸資産の回転期間を日数で求める問題
    prereq: 棚卸資産回転率（回数）は売上原価を平均棚卸資産で割ること、回転期間は 365 日を回転率で割ること（売上高ではなく売上原価を使う）
    hard: 回転率の分子に売上高ではなく売上原価を使うことと、回数（回転率）から日数（回転期間）への変換の両方を正しく扱う必要がある。
    q: |
      ある会社の年間売上原価は 7,300 万円、売上高は 14,600 万円、平均棚卸資産は 500 万円である。1 年を 365 日として、棚卸資産の回転期間は何日か。
    c:
      - '14.6'
      - '25'
      - '29.2'
      - '12.5'
    a: イ
    exp: |
      棚卸資産回転率 ＝ 売上原価 ÷ 平均棚卸資産 ＝ 7,300 ÷ 500 ＝ 14.6 回です。

      回転期間 ＝ 365 ÷ 14.6 ＝ 25 日

      在庫の回転は、原価ベースで測るため、分子には売上高ではなく売上原価を用います。売上高で計算すると利益分だけ回転率が大きく（29.2 回）なり、期間は 12.5 日と実際より短く見えてしまうため、注意が必要です。
    why:
      - 回転率（7,300 ÷ 500 ＝ 14.6 回）をそのまま答えた値です。問われているのは日数なので、365 日を回転率で割ります。
      - 正解です。回転率 14.6 回から、期間は 365 ÷ 14.6 ＝ 25 日です。
      - 売上高を使った回転率（14,600 ÷ 500 ＝ 29.2 回）を、日数に換算せずに答えた値です。分子は売上原価で、さらに日数への換算が必要です。
      - 分子に売上高を用いた場合の回転期間（365 ÷ (14,600 ÷ 500) ＝ 12.5）です。在庫は原価で評価されるため、売上原価を使います。
    know: 在庫の回転期間は、売上原価ベースの回転率から求める（回転期間 ＝ 365 ÷ 回転率 ＝ 365 × 平均棚卸資産 ÷ 売上原価）。回転率（回）と回転期間（日）を取り違えないこと、売上高を使うと利益分だけ回転が速く見えることが要点である。
    terms:
      - 棚卸資産回転率
      - 在庫管理
    verify:
      value: 365 / (7300 / 500)
  - id: A22-520
    topic: 22-3-2
    diff: 3
    scope: 22-3-2 財務会計と管理会計の用語例「経済性計算」。各年のキャッシュフローを与えられた現価係数で現在価値に換算して累計し、投資額に達するまでの期間を按分して求める問題
    prereq: 現価係数を掛けると将来のキャッシュフローが現在価値になること、回収期間は累計が投資額に達する時点で、途中の年はその年の額で按分すること
    hard: 各年のキャッシュフローを先に現在価値に換算してから累計する段階と、最後の年の端数を換算後の額で按分する段階の両方が必要になる。換算前の額で累計・按分すると別の値になる。
    q: |
      投資額 1,000 万円の設備投資案がある。キャッシュフローは 1 年目 500 万円、2 年目 500 万円、3 年目 400 万円で、各年の現価係数は 1 年目 0.9、2 年目 0.8、3 年目 0.75 である。各年のキャッシュフローを現在価値に換算してから累計し、累計が投資額に達するまでの期間（割引回収期間）を求めると何年か。ここで、キャッシュフローは各年を通じて均等に発生するものとし、年の途中の分は按分して求める。
    c:
      - '2'
      - '2.5'
      - '2.375'
      - '3'
    a: イ
    exp: |
      各年のキャッシュフローを現在価値に換算します。
      - 1 年目 ＝ 500 × 0.9 ＝ 450 万円、2 年目 ＝ 500 × 0.8 ＝ 400 万円、3 年目 ＝ 400 × 0.75 ＝ 300 万円
      - 累計は 1 年目 450 万円、2 年目 850 万円、3 年目 1,150 万円で、3 年目の途中で投資額 1,000 万円に達します。
      - 2 年目末の不足額は 1,000 − 850 ＝ 150 万円で、3 年目の現在価値 300 万円で按分すると 150 ÷ 300 ＝ 0.5 年
      割引回収期間 ＝ 2 ＋ 0.5 ＝ 2.5 年です。現在価値で考えると、割り引かない場合より回収に時間がかかります。
    why:
      - 現在価値に換算せずに累計した値です（500 ＋ 500 ＝ 1,000 万円で 2 年目末に回収）。本問は換算後の累計で判定します。
      - 正解です。換算後の累計は 2 年目末で 850 万円、残り 150 万円を 3 年目の 300 万円で按分して 2.5 年です。
      - 累計は現在価値で行ったが、按分に換算前の 3 年目のキャッシュフロー 400 万円を使った値（2 ＋ 150 ÷ 400）です。按分も換算後の 300 万円で行います。
      - 回収が完了する年度の番号をそのまま答えた値です。年の途中の分を按分すると 2.5 年です。
    know: 回収期間法は累計キャッシュフローが投資額に達する時点で評価する。通常の回収期間法は貨幣の時間価値を考慮しないが、現在価値に換算してから累計すれば時間価値を反映でき、回収期間は長くなる。
    terms:
      - 回収期間法
      - キャッシュフロー
    verify:
      value: 2 + (1000 - (500 * 0.9 + 500 * 0.8)) / (400 * 0.75)
  - id: A22-521
    topic: 22-3-1-2
    diff: 2
    scope: 22-3-1-2 企業会計の手順（決算整理）。売掛金残高に貸倒実績率を掛けた要設定額から、既にある引当金残高を差し引いて繰入額を求める問題（差額補充法）
    prereq: 貸倒引当金は、期末の債権残高に貸倒の実績率を掛けて見積もること、差額補充法では要設定額と既存の残高の差額だけを繰り入れること
    q: |
      決算において、売掛金 2,000 万円に対して貸倒実績率 2 ％で貸倒引当金を設定する。貸倒引当金の既存の残高が 15 万円あるとき、差額補充法により当期に繰り入れる金額は何万円か。
    c:
      - '55'
      - '40'
      - '15'
      - '25'
    a: エ
    exp: |
      まず、期末に必要な引当金の額（要設定額）を計算します。

      要設定額 ＝ 2,000 万円 × 2 ％ ＝ 40 万円

      差額補充法では、既にある残高との差額だけを繰り入れます。

      繰入額 ＝ 40 － 15 ＝ 25 万円

      引当金は、将来の貸倒れに備えて、損失の見込み額をあらかじめ費用として計上し、債権の評価から差し引いておく仕組み（貸倒引当金は資産の控除項目として表示される）であり、実際にはまだ発生していない損失を見積もる点が特徴です。
    why:
      - 既存の残高を差し引く代わりに加えてしまった場合の値です。繰入れは残高を要設定額まで増やす操作です。
      - 要設定額そのものです。既存の残高があるため、その分を差し引いた額が繰入額になります。
      - 既存の残高そのものです。本問で求めるのは、当期に新たに繰り入れる金額です。
      - 正解です。要設定額 40 万円から既存の残高 15 万円を差し引いた 25 万円です。
    know: 貸倒引当金の設定は「要設定額を決める計算」と「残高との差額を繰り入れる手続き」の 2 段構えである。差額補充法と、全額を入れ替える洗替法との違いも要点である。
    terms:
      - 貸倒引当金
    verify:
      value: 2000 * 0.02 - 15
  - id: A22-522
    topic: 22-2-1-2
    diff: 3
    scope: 22-2-1-2 在庫問題の用語例「EOQ」。EOQ の式の形（平方根の中で年間需要量に比例し、保管費用に反比例する）から、条件が変わったときの EOQ を求める問題
    prereq: EOQ ＝ √（2 × 年間需要量 × 1 回当たりの発注費用 ÷ 1 個当たりの年間保管費用）という式の形
    hard: 発注費用の値が与えられていないため、公式に数値を代入するのではなく、需要量と保管費用の変化が平方根の中でどう効くかを組み立てる必要がある。平方根を取り忘れる、片方の変化しか反映しない、保管費用の位置を取り違える、という誤りがそれぞれ別の値になる。
    q: |
      ある部品を経済的発注量（EOQ）で発注しており、現在の EOQ は 300 個である。来期は、年間需要量が 2 倍になり、1 個当たりの年間保管費用が半分になる見込みである。1 回当たりの発注費用が変わらないとき、来期の EOQ は何個か。ここで、EOQ は √（2 × 年間需要量 × 1 回当たりの発注費用 ÷ 1 個当たりの年間保管費用）で求めるものとする。
    c:
      - '600'
      - 1,200
      - '424'
      - '300'
    a: ア
    exp: |
      EOQ は平方根の中で、年間需要量に比例し、1 個当たりの年間保管費用に反比例します。
      - 平方根の中の値は、需要量が 2 倍で 2 倍、保管費用が半分で 2 倍になるので、合わせて 2 × 2 ＝ 4 倍
      - EOQ は平方根を取るので √4 ＝ 2 倍
      - 来期の EOQ ＝ 300 × 2 ＝ 600 個
      発注量を 2 倍にすると、年間の発注回数は需要量 2 倍 ÷ 発注量 2 倍で変わらず、平均在庫は 2 倍、保管単価は半分なので保管費用も変わりません。発注費用と保管費用が等しいという EOQ の性質も保たれています。
    why:
      - 正解です。平方根の中が 4 倍になるので、EOQ は √4 ＝ 2 倍の 600 個です。
      - 平方根を取らず、EOQ が需要量に比例し保管費用に反比例すると考えた値（300 × 2 × 2）です。変化は平方根の中で効きます。
      - 需要量の変化だけを反映した値（300 × √2 ≒ 424）です。保管費用が半分になる変化も平方根の中で 2 倍に効きます。
      - 保管費用が分子にあると取り違え、需要量 2 倍と保管費用半分が打ち消し合うと考えた値（300 × √（2 × 0.5））です。保管費用は分母にあります。
    know: EOQ は年間需要量と発注費用の積の平方根に比例し、保管費用の平方根に反比例する。需要量が 4 倍でも EOQ は 2 倍にしかならない。EOQ では年間の発注費用と保管費用が等しくなる。
    terms:
      - 経済的発注量
      - 在庫管理
    verify:
      value: 300 * sqrt(2 / 0.5)
  - id: A22-523
    topic: 22-2-1-2
    diff: 3
    scope: 22-2-1-2 発注点と安全在庫。リードタイム中の平均使用量に、需要のばらつきから決まる安全在庫を加えて発注点を求める問題
    prereq: 安全在庫は「安全係数 × 1 日の使用量の標準偏差 × リードタイムの平方根」、発注点は「1 日平均使用量 × リードタイム ＋ 安全在庫」
    hard: 安全在庫の計算で、リードタイムに平方根を取る点が要点になる。平均使用量分とばらつき分を分けて計算する必要がある。
    q: |
      ある部品の 1 日の平均使用量は 50 個、リードタイムは 6 日、1 日の使用量の標準偏差は 10 個、安全係数は 2 である。発注点は何個か。ここで、6 の平方根は約 2.45 として計算すること。
    c:
      - '349'
      - '320'
      - '360'
      - '400'
    a: ア
    exp: |
      発注点 ＝ 1 日平均使用量 × リードタイム ＋ 安全在庫 です。
      - リードタイム中の平均使用量： 50 × 6 ＝ 300 個
      - 安全在庫： 2 × 10 × √6 ≒ 2 × 10 × 2.45 ＝ 49 個
      - 発注点 ＝ 300 ＋ 49 ＝ 349 個
    why:
      - 正解です。300 ＋ 49 ＝ 349 個です。
      - 安全在庫を 2 × 10 ＝ 20 個とした場合の値です。リードタイムの平方根を掛けていません。
      - 安全在庫を標準偏差 × リードタイム（10 × 6 ＝ 60 個）とした場合の値です。ばらつきの合算には平方根を使います。
      - 安全在庫を 1 日の平均使用量 × 安全係数（50 × 2 ＝ 100 個）とした場合の値です。安全在庫は使用量の平均ではなく、ばらつき（標準偏差）から求めます。
    know: 発注点は「リードタイム中の平均使用量 ＋ 安全在庫」。安全在庫は需要のばらつきに対応する分であり、標準偏差にリードタイムの平方根を掛ける形が標準である。
    terms:
      - 発注点
      - 安全在庫
    verify:
      value: 50 * 6 + 2 * 10 * 2.45
  - id: A22-524
    topic: 22-3-1-1
    diff: 3
    scope: 22-3-1-1 売上と利益の関係（損益分岐点の関連計算）。目標とする売上高営業利益率を達成する売上高を、限界利益率から目標利益率を差し引いた率で固定費を割って求める問題
    prereq: 売上高 × 限界利益率 ＝ 固定費 ＋ 営業利益 という関係と、営業利益 ＝ 売上高 × 売上高営業利益率 という関係
    hard: 目標利益が金額でなく売上高に対する率で与えられるため、目標利益も売上高に比例することを式に組み入れ、「固定費 ÷（限界利益率 − 目標利益率）」の形を導く必要がある。目標利益を損益分岐点売上高から見積もる誤りと区別する。
    q: |
      ある会社の固定費は 3,000 万円であり、変動費率は売上高の 60 ％である。売上高営業利益率 10 ％を達成するために必要な売上高は何万円か。
    c:
      - 10,000
      - 6,000
      - 9,375
      - 7,500
    a: ア
    exp: |
      必要な売上高を S とすると、限界利益（S × 0.4）が固定費と営業利益（S × 0.1）の合計に等しくなります。
      - 0.4S ＝ 3,000 ＋ 0.1S
      - 0.3S ＝ 3,000 なので、S ＝ 3,000 ÷ （0.4 − 0.1） ＝ 10,000 万円
      検算すると、売上高 10,000 万円のとき変動費 6,000 万円、固定費 3,000 万円で営業利益は 1,000 万円となり、売上高営業利益率は 10 ％です。目標利益が 0 の場合が損益分岐点売上高（3,000 ÷ 0.4 ＝ 7,500 万円）です。
    why:
      - 正解です。固定費 3,000 万円を、限界利益率 0.4 から目標利益率 0.1 を引いた 0.3 で割った値です。
      - 目標利益率を限界利益率から差し引かずに足して、3,000 ÷ （0.4 ＋ 0.1）とした値です。利益の分は限界利益から固定費を回収した残りなので、差し引きます。
      - 目標利益を損益分岐点売上高 7,500 万円の 10 ％の 750 万円と見積もり、（3,000 ＋ 750） ÷ 0.4 とした値です。目標利益は求める売上高の 10 ％で、売上高に応じて増えます。
      - 損益分岐点売上高（固定費 ÷ 限界利益率）です。目標とする営業利益の分も稼ぐ必要があります。
    know: 目標利益が金額で与えられれば必要売上高 ＝ （固定費 ＋ 目標利益）÷ 限界利益率、売上高に対する率で与えられれば必要売上高 ＝ 固定費 ÷ （限界利益率 − 目標利益率）となる。どちらも損益分岐点の式の拡張である。
    terms:
      - 損益分岐点
      - 限界利益
    verify:
      value: 3000 / ((1 - 0.6) - 0.1)
