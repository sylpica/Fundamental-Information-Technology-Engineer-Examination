questions:
  - id: A04-525
    topic: 3-2-5
    diff: 3
    scope: 3-2-5 メモリの容量と性能（キャッシュメモリのヒット率、実効アクセス時間）。改善案ごとに実効アクセス時間を求めて比較するもので、シラバスに明記された実効アクセス時間の計算の範囲内
    prereq: 実効アクセス時間 ＝ ヒット率 × キャッシュのアクセス時間 ＋（1 － ヒット率）× 主記憶のアクセス時間
    hard: 四つの改善案それぞれについて実効アクセス時間を計算し直して比べる必要がある。「主記憶を半分の時間にする」のような変化量の大きい案に目を奪われやすく、ミスした場合の時間が実効アクセス時間に与える影響の大きさを読み取る必要がある。
    q: |
      キャッシュメモリのアクセス時間が 10 ナノ秒、主記憶のアクセス時間が 100 ナノ秒、キャッシュメモリのヒット率が 90 ％のシステムがある。ミスした場合は主記憶のアクセス時間だけがかかる（キャッシュメモリのアクセス時間は加算しない）ものとする。次の改善案のうち、実効アクセス時間が最も短くなるものはどれか。ここで、各案は記述した項目だけを変更し、他の条件は元のままとする。
    c:
      - ヒット率を 96 ％に上げる
      - 主記憶のアクセス時間を 50 ナノ秒に短縮する
      - キャッシュメモリのアクセス時間を 5 ナノ秒に短縮する
      - ヒット率を 93 ％に上げ、主記憶のアクセス時間を 80 ナノ秒に短縮する
    a: ア
    exp: |
      実効アクセス時間 ＝ ヒット率 × 10 ＋（1 － ヒット率）× 100 を、案ごとに計算します。現在は 0.9 × 10 ＋ 0.1 × 100 ＝ 19 ナノ秒です。

      | 案 | 計算 | 実効アクセス時間 |
      | --- | --- | --- |
      | ヒット率 96 ％ | 0.96 × 10 ＋ 0.04 × 100 | 13.6 ナノ秒 |
      | 主記憶 50 ナノ秒 | 0.9 × 10 ＋ 0.1 × 50 | 14 ナノ秒 |
      | キャッシュ 5 ナノ秒 | 0.9 × 5 ＋ 0.1 × 100 | 14.5 ナノ秒 |
      | ヒット率 93 ％・主記憶 80 ナノ秒 | 0.93 × 10 ＋ 0.07 × 80 | 14.9 ナノ秒 |

      最も短くなるのはヒット率を 96 ％に上げる案です。ミスしたときの主記憶のアクセス時間がキャッシュよりはるかに長いため、ミス率をわずかに下げるだけでも効果が大きくなります。
    why:
      - 正解です。0.96 × 10 ＋ 0.04 × 100 ＝ 13.6 ナノ秒で、四つの案の中で最も短くなります。
      - 0.9 × 10 ＋ 0.1 × 50 ＝ 14 ナノ秒です。主記憶の時間を半分にしても、効くのはミスした 10 ％のアクセスだけなので、ヒット率を 96 ％にする案（13.6 ナノ秒）には及びません。
      - 0.9 × 5 ＋ 0.1 × 100 ＝ 14.5 ナノ秒です。キャッシュの時間を半分にしても、実効アクセス時間の大部分を占めるミス時の 10 ナノ秒分（0.1 × 100）は変わりません。
      - 0.93 × 10 ＋ 0.07 × 80 ＝ 14.9 ナノ秒です。二つの項目を同時に改善していますが、それぞれの改善幅が小さく、最も短くはなりません。
    know: 実効アクセス時間はヒット率による加重平均であり、キャッシュと主記憶の速度差が大きいほど、ミス率（1 － ヒット率）の影響が大きくなる。改善策は、変化の大きさではなく、式に当てはめた結果で比べる。
    terms:
      - キャッシュメモリ
      - ヒット率
      - 実効アクセス時間
    verify:
      manual: 現在 0.9×10＋0.1×100＝19、各案 0.96×10＋0.04×100＝13.6、0.9×10＋0.1×50＝14、0.9×5＋0.1×100＝14.5、0.93×10＋0.07×80＝14.9 を再計算し、ヒット率 96 ％の案だけが最小であることを確認
  - id: A04-526
    topic: 4-1-6
    diff: 2
    scope: 4-1-6 ストレージ（用語例：RAID5、パリティ）。RAID5 で故障したディスクのデータを、残りのデータとパリティの排他的論理和から復元する仕組みを、4 ビットの例で確かめる問題で、RAID の代表的な特徴の理解として範囲内
    prereq: 排他的論理和の計算（同じ値どうしは 0、異なる値どうしは 1）、RAID5 のパリティがデータの排他的論理和であること
    q: |
      4 台のディスクで構成した RAID5 のあるストライプには、3 台にデータ D1、D2、D3（各 4 ビット）が、残る 1 台にパリティ P が記録されている。P は D1、D2、D3 のビットごとの排他的論理和である。D2 を記録したディスクが故障し、残りのディスクから D1 ＝ 1011、D3 ＝ 1100、P ＝ 0001 が読み出せた。復元される D2 の値はどれか。
    c:
      - '0110'
      - '0111'
      - '1111'
      - '0000'
    a: ア
    exp: |
      P ＝ D1 ⊕ D2 ⊕ D3（⊕ は排他的論理和）なので、両辺に D1 と D3 の排他的論理和をとると、D2 ＝ D1 ⊕ D3 ⊕ P になります。同じ値の排他的論理和は 0 になるためです。

      | 値 | ビット列 |
      | --- | --- |
      | D1 | 1011 |
      | D3 | 1100 |
      | D1 ⊕ D3 | 0111 |
      | P | 0001 |
      | D2 ＝ D1 ⊕ D3 ⊕ P | 0110 |

      確かめると、1011 ⊕ 0110 ⊕ 1100 ＝ 0001 となり、記録されていた P と一致します。RAID5 では、このようにどの 1 台が故障しても、残りのデータとパリティから失われたデータを復元できます。
    why:
      - 正解です。D1 ⊕ D3 ⊕ P ＝ 1011 ⊕ 1100 ⊕ 0001 ＝ 0110 です。
      - D1 ⊕ D3 ＝ 0111 だけを求め、パリティ P との排他的論理和をとっていない値です。D2 の復元には残っている全ディスクの値を使います。
      - D1、D3、P の論理和（1011 OR 1100 OR 0001）です。パリティは論理和ではなく排他的論理和で作られるので、論理和では復元できません。
      - D1、D3、P の論理積（1011 AND 1100 AND 0001）です。パリティは論理積ではなく排他的論理和で作られます。
    know: RAID5 のパリティは各データの排他的論理和であり、1 台分の情報が失われても残りの排他的論理和で復元できる。2 台が同時に故障すると復元できないため、2 種類のパリティをもつ RAID6 が使われることがある。
    terms:
      - RAID5
      - パリティ
      - 排他的論理和
    verify:
      type: value
      value: Number((0b1011 ^ 0b1100 ^ 0b0001).toString(2).padStart(4, '0'))
  - id: A04-527
    topic: 4-2-2-2
    diff: 3
    scope: 4-2-2-2 信頼性指標と信頼性計算（MTBF、MTTR、稼働率、直列システム）。装置ごとに MTBF と MTTR から稼働率を求め、直列システムの稼働率に合成する問題で、シラバスに明記された基本的な計算の組合せ
    prereq: 稼働率 ＝ MTBF ÷（MTBF ＋ MTTR）であること、直列システムの稼働率は各装置の稼働率の積であること
    hard: 装置ごとの稼働率を先に求めてから直列の積をとる 2 段階の計算が必要である。MTBF と MTTR をそれぞれ合計して一度に割る、稼働率を平均する、といった手順の誤りを誘う。
    q: |
      装置 A は MTBF が 450 時間、MTTR が 50 時間であり、装置 B は MTBF が 950 時間、MTTR が 50 時間である。A と B を直列に接続し、両方が稼働しているときだけ稼働するシステムの稼働率はどれか。
    c:
      - '0.855'
      - '0.933'
      - '0.925'
      - '0.995'
    a: ア
    exp: |
      まず、装置ごとの稼働率を求めます。
      - 装置 A：450 ÷（450 ＋ 50）＝ 0.9
      - 装置 B：950 ÷（950 ＋ 50）＝ 0.95

      直列システムでは両方が稼働している必要があるので、稼働率は積になります。

      0.9 × 0.95 ＝ 0.855

      MTBF どうし・MTTR どうしを合計して 1,400 ÷ 1,500 とする計算は、二つの装置の停止が重ならないかのように扱っており、直列システムの稼働率にはなりません。
    why:
      - 正解です。0.9 × 0.95 ＝ 0.855 です。
      - MTBF と MTTR をそれぞれ合計して（450 ＋ 950）÷（450 ＋ 950 ＋ 50 ＋ 50）＝ 1,400 ÷ 1,500 ≒ 0.933 とした値です。直列システムは、装置ごとの稼働率の積で求めます。
      - 二つの装置の稼働率を平均した値（（0.9 ＋ 0.95）÷ 2 ＝ 0.925）です。直列では、どちらか一方の停止でシステムが止まるので積になります。
      - 並列システム（どちらか一方が稼働していればよい）として 1 －（1 － 0.9）×（1 － 0.95）＝ 0.995 とした値です。本問は両方の稼働が必要な直列です。
    know: 稼働率の計算は、装置ごとに MTBF ÷（MTBF ＋ MTTR）で求めてから、直列は積、並列は 1 －（停止している確率の積）で合成する。直列にするほど稼働率は個々の装置より低くなる。
    terms:
      - MTBF
      - MTTR
      - 稼働率
    verify:
      type: value
      value: 450 / (450 + 50) * (950 / (950 + 50))
      tolerance: 0.000001
  - id: A04-528
    topic: 3-1-8
    diff: 3
    scope: 3-1-8 プロセッサの高速化技術（用語例：パイプライン）。パイプラインを使わない場合との処理時間の比（高速化率）を求め、命令数を増やしたときに段数に近づくことを判断する問題で、パイプラインの基本的な性能計算の範囲内
    prereq: パイプラインの処理時間 ＝（段数 ＋ 命令数 － 1）× 1 段の時間、パイプラインを使わない場合の処理時間 ＝ 命令数 × 段数 × 1 段の時間
    hard: 命令数 100 個での高速化率を二つの処理時間の比として計算したうえで、命令数を増やしたときの極限（段数）まで考える必要がある。パイプラインを満たすまでの時間を無視する誤りや、命令数に比例して速くなるという誤解を誘う。
    q: |
      4 段のパイプラインで命令を実行する。各段の処理時間はどれも 10 ナノ秒で、パイプラインは乱れなく動作する。パイプラインを使わずに 1 命令ずつ 4 段を順に処理する場合と比べた高速化率（処理時間の比）について、命令数が 100 個のときの値と、命令数を十分に大きくしていったときの値の組合せとして、適切なものはどれか。
    c:
      - 100 個のときは約 3.9 倍で、命令数を増やすと 4 倍に近づく
      - 100 個のときは約 3.9 倍で、命令数を増やすほど際限なく大きくなる
      - 100 個のときは 4 倍で、命令数を増やしても 4 倍のまま変わらない
      - 100 個のときは約 1.0 倍で、命令数を増やすと 4 倍に近づく
    a: ア
    exp: |
      命令数を n とすると、処理時間は次のとおりです。

      | 方式 | 処理時間 | n ＝ 100 のとき |
      | --- | --- | --- |
      | パイプラインなし | n × 4 × 10 | 4,000 ナノ秒 |
      | パイプライン | （4 ＋ n － 1）× 10 | 1,030 ナノ秒 |

      高速化率は 4,000 ÷ 1,030 ≒ 3.9 倍です。一般に高速化率は 4n ÷（n ＋ 3）で、n を大きくすると最初の命令がパイプラインを満たすまでの 3 段分の遅れが相対的に無視できるようになり、段数の 4 倍に近づきます。段数を超えて速くなることはありません。
    why:
      - 正解です。4,000 ÷ 1,030 ≒ 3.9 倍で、命令数を増やすと 4n ÷（n ＋ 3）は段数の 4 に近づきます。
      - 100 個のときの値は正しいものの、高速化率は段数（4）を上限として近づくだけで、命令数を増やしても際限なく大きくはなりません。
      - パイプラインを満たすまでの時間を無視し、パイプラインの処理時間を 100 × 10 ＝ 1,000 ナノ秒とした場合の値です。実際は最初の命令が完了するまでに 4 段分かかるので、100 個のときは 4 倍に届きません。
      - パイプラインの処理時間 1,030 ナノ秒を、命令数 × 1 段の時間（1,000 ナノ秒）と比べた値です。比べる相手は、パイプラインを使わない場合の 4,000 ナノ秒です。
    know: パイプラインの高速化率の上限は段数であり、命令数が多いほど上限に近づく。実際には分岐やデータの依存によるハザードでパイプラインが乱れ、上限より低くなる。
    terms:
      - パイプライン
    verify:
      manual: パイプラインなし 100×4×10＝4,000、パイプライン (4＋99)×10＝1,030、比 3.883 を再計算。4n÷(n＋3) は n→∞ で 4 に近づくこと、誤答の 4 倍＝4,000÷1,000、約 1.0 倍＝1,030÷1,000 を確認
  - id: A04-529
    topic: 3-5-3
    diff: 3
    scope: 3-5-3 補助記憶装置（用語例：トラック、セクター、ブロック化因数）。ブロック化したレコードを、セクタ単位・トラック単位の制約の下で磁気ディスクに格納するときの必要トラック数を求める問題で、ハードディスク装置の記憶容量の計算として範囲内
    prereq: ブロック化（複数のレコードをまとめて 1 ブロックとする）、セクタとトラックの関係、端数の切上げ・切捨て
    hard: 1 ブロックが占めるセクタ数（切上げ）、1 トラックに入るブロック数（切捨て）、必要トラック数（切上げ）と、端数処理の異なる 3 段階の計算が必要である。総バイト数を容量で割るだけの計算では、セクタの使い残しが反映されない。
    q: |
      1 トラックが 50 セクタ、1 セクタが 512 バイトの磁気ディスク装置に、1 件 200 バイトのレコードを 12,000 件格納する。レコードは 5 件ずつブロック化（1 ブロック ＝ 1,000 バイト）して記録し、1 ブロックは連続する整数個のセクタに格納する。1 セクタに複数のブロックを格納することはなく、ブロックはトラックをまたがないものとする。必要なトラック数はいくつか。
    c:
      - '96'
      - '94'
      - '120'
      - '240'
    a: ア
    exp: |
      次の順に計算します。

      | 段階 | 計算 | 結果 |
      | --- | --- | --- |
      | 1 ブロックのセクタ数 | 1,000 ÷ 512 ＝ 1.95… → 切上げ | 2 セクタ |
      | 1 トラックのブロック数 | 50 ÷ 2 | 25 ブロック（125 件） |
      | 必要なブロック数 | 12,000 ÷ 5 | 2,400 ブロック |
      | 必要なトラック数 | 2,400 ÷ 25 | 96 トラック |

      1 ブロックは 2 セクタ（1,024 バイト）を占め、24 バイトは使われずに残ります。このような使い残しがあるため、総バイト数をトラックの容量で割るだけでは正しいトラック数になりません。
    why:
      - 正解です。1 ブロック 2 セクタ、1 トラック 25 ブロックなので、2,400 ブロック ÷ 25 ＝ 96 トラックです。
      - 総データ量 12,000 × 200 ＝ 2,400,000 バイトを、1 トラックの容量 50 × 512 ＝ 25,600 バイトで割った値（93.75 → 94）です。ブロックごとにセクタの使い残しが生じることを考慮していません。
      - ブロック化せずに、1 セクタに 2 件ずつ（512 ÷ 200 ＝ 2.56 → 2 件）格納した場合の値（12,000 ÷ 100）です。本問はブロック化因数 5 でブロック化しています。
      - ブロック化せずに、1 セクタに 1 件ずつ格納した場合の値（12,000 ÷ 50）です。本問はブロック化因数 5 でブロック化しています。
    know: ブロック化因数を大きくすると、1 回の入出力で読み書きできるレコードが増え、記憶領域の利用効率も上がりやすい。ただし、ブロックとセクタの大きさの関係によっては使い残しが生じるため、端数の扱い（切上げ・切捨て）に注意する。
    terms:
      - ブロック化因数
      - セクター
      - トラック
    verify:
      type: value
      value: ceil(12000 / (5 * floor(50 / ceil(5 * 200 / 512))))
  - id: A04-530
    topic: 3-1-10
    diff: 3
    scope: 3-1-10 マルチプロセッサシステム（用語例：アムダールの法則）。アムダールの法則で複数のコア数について高速化率を求め、コア 1 個当たりの効果（高速化率 ÷ コア数）が低下していく様子を判断する問題で、法則の基本式の適用として範囲内
    prereq: アムダールの法則（高速化率 ＝ 1 ÷ （並列化できない割合 ＋ 並列化できる割合 ÷ コア数））、問題文で定義された並列化効率の計算
    hard: コア数ごとに高速化率を求め、さらにコア数で割って 0.5 と比べる、という計算を複数のコア数について繰り返す必要がある。並列化割合と逐次割合の取り違えや、高速化率がコア数に比例するという誤解を誘う。
    q: |
      処理時間の 90 ％を並列化できるプログラムがある。アムダールの法則に基づいて、コア数を 2、4、8、16 と増やしたときの高速化率（1 コアで実行した場合に対する倍率）を求め、高速化率をコア数で割った値を並列化効率とする。並列化効率が初めて 0.5 を下回るコア数はどれか。ここで、並列化に伴うオーバヘッドは無視する。
    c:
      - '4'
      - '8'
      - '16'
      - 2〜16 のいずれのコア数でも 0.5 を下回らない
    a: ウ
    exp: |
      高速化率 ＝ 1 ÷ （0.1 ＋ 0.9 ÷ コア数）を求め、コア数で割ります。

      | コア数 | 高速化率 | 並列化効率 |
      | --- | --- | --- |
      | 2 | 1 ÷ 0.55 ≒ 1.82 | 約 0.91 |
      | 4 | 1 ÷ 0.325 ≒ 3.08 | 約 0.77 |
      | 8 | 1 ÷ 0.2125 ≒ 4.71 | 約 0.59 |
      | 16 | 1 ÷ 0.15625 ＝ 6.4 | 0.40 |

      並列化効率が初めて 0.5 を下回るのは 16 コアです。コアを増やしても逐次部分の 10 ％は短くならないため、高速化率は上限の 1 ÷ 0.1 ＝ 10 倍に頭打ちとなり、コア 1 個当たりの効果は下がり続けます。
    why:
      - 並列化できる割合と逐次部分の割合を取り違え、高速化率を 1 ÷ （0.9 ＋ 0.1 ÷ コア数）とした場合の値です。この式では 4 コアで効率が約 0.27 となりますが、本問で並列化できるのは 90 ％です。
      - 8 コアでの並列化効率は 4.71 ÷ 8 ≒ 0.59 で、まだ 0.5 を下回っていません。「逐次部分の割合 × コア数（0.1 × 8 ＝ 0.8）が 0.5 を超えたら効率が半分を切る」といった近似で判断すると誤ります。
      - 正解です。16 コアで高速化率 6.4、並列化効率 0.4 となり、初めて 0.5 を下回ります。
      - 高速化率を 0.9 × コア数 ＋ 0.1 のように、並列化できる部分がコア数に比例して効くと考えた場合の判断です。アムダールの法則では処理時間の比で計算するため、16 コアで効率は 0.4 まで下がります。
    know: アムダールの法則では、コア数を増やすほど高速化率の伸びは小さくなり、コア 1 個当たりの効果（並列化効率）は下がる。逐次部分の割合が小さく見えても、コア数が多くなると支配的になる。
    terms:
      - アムダールの法則
      - 並列処理
    verify:
      type: value
      value: '[2, 4, 8, 16].find((n) => 1 / (0.1 + 0.9 / n) / n < 0.5)'
  - id: A04-531
    topic: 4-1-7
    diff: 3
    scope: 4-1-7 アクティブ・アクティブ構成の容量設計。両系が負荷を分け合う構成で、片系の故障時に残りの系が全体の負荷を引き受けるための余裕の考え方
    prereq: 負荷を分け合う構成では、片系が止まったときに、残りの系の処理能力が全体の負荷以上でなければ、サービスを維持できないこと
    hard: 冗長構成の「台数」ではなく、故障時の負荷の移動先の処理能力に着目する必要がある。通常時の負荷率の上限（50％）を、故障時の引き受け可能量から逆算する。
    q: |
      2 台のサーバで負荷を均等に分け合うアクティブ・アクティブ構成の Web システムがある。片方のサーバが故障しても、残りの 1 台でサービスの応答時間を維持したまま処理を継続したい。通常時の運用として適切なものはどれか。
    c:
      - 各サーバの負荷率を 90 ％程度まで高め、設備の利用効率を優先する
      - 各サーバの負荷率を 50 ％以下に抑え、故障時には残りのサーバが全体の負荷を引き受けられるようにする
      - 故障時に備えて、各サーバに全体の負荷を処理できる性能を持たせ、通常時も負荷率を 100 ％で運用する
      - 故障したサーバの負荷は、自動的にクライアント側で処理されるため、負荷率の配慮は不要である
    a: イ
    exp: |
      負荷を分け合う構成では、片系の故障時に、もう一方が全体の負荷（通常時の 2 台分）を引き受けます。応答時間を維持したまま引き受けるには、残りの 1 台に全体の負荷を処理する余力が必要であり、通常時の負荷率は各台 50 ％以下に抑えることが条件になります。負荷率を高くし過ぎると、故障時に過負荷となり、応答の悪化や連鎖的な停止を招きます。
    why:
      - 利用効率は上がりますが、片系の故障時に残りのサーバが全体の負荷を処理し切れず、応答時間を維持できません。
      - 正解です。故障時の引き受けを可能にするため、通常時は各台 50 ％以下が条件です。
      - 全体の負荷を処理できる性能があっても、負荷率 100 ％で運用すれば余力がなく、故障時の上乗せに耐えられません。
      - サーバの処理をクライアント側が肩代わりすることはなく、負荷は残りのサーバに集中します。
    know: 冗長構成の可用性は、台数だけでなく「故障時に負荷が移る先の余力」で決まる。分け合う構成では、通常時の負荷率の上限が故障時の継続条件から逆算される点が要点である。
    terms:
      - 冗長化
      - フェイルオーバ
    verify:
      manual: 2台で負荷を分け合う構成で片系が故障すると残りの1台が全体の負荷を引き受けること、そのため通常時の負荷率を各台50％以下に抑える必要があることを、他の選択肢（高負荷運用、クライアント肩代わり、余力なしの100％運用）との対比で確認した。
  - id: A04-532
    topic: [4-2-1-2, 1-2-6]
    diff: 3
    scope: 4-2-1-2 キャパシティプランニング（性能要件から性能諸元を見積もる）と 1-2-6 待ち行列理論（M/M/1 モデルにおける簡単な計算）。応答時間の要件から、M/M/1 の式を使ってサーバに必要な処理性能を逆算する問題で、シラバスの M/M/1 の簡単な計算の範囲内
    prereq: M/M/1 の平均応答時間 ＝ 1 ÷（平均サービス率 － 平均到着率）、平均サービス時間 ＝ 1 ÷ 平均サービス率
    hard: 応答時間の式を順方向に使うのではなく、要件からサービス率を逆算し、さらに処理時間に換算する必要がある。待ち時間の式との取り違えや、到着間隔をそのまま処理時間の上限とする誤りを誘う。
    q: |
      1 台のサーバで要求を処理するオンラインシステムを、M/M/1 の待ち行列モデルで表す。要求は平均 8 件／秒で到着する。平均応答時間（待ち時間と処理時間の合計）を 0.25 秒以下にするには、1 件当たりの平均処理時間を約何ミリ秒以下にする必要があるか。
    c:
      - '83'
      - '92'
      - '125'
      - '250'
    a: ア
    exp: |
      平均サービス率を μ 件／秒とすると、M/M/1 の平均応答時間は 1 ÷（μ － 8）です。

      1 ÷（μ － 8）≦ 0.25 より、μ － 8 ≧ 4、μ ≧ 12 件／秒

      平均処理時間は 1 ÷ μ なので、1 ÷ 12 ≒ 0.0833 秒、すなわち約 83 ミリ秒以下にする必要があります。このときの利用率は 8 ÷ 12 ≒ 0.67 です。平均到着間隔（125 ミリ秒）より処理時間が短くても、利用率が 1 に近いと待ち時間が急増するため、応答時間の要件を満たすには処理性能に余裕が必要です。
    why:
      - 正解です。μ ≧ 8 ＋ 1 ÷ 0.25 ＝ 12 件／秒なので、平均処理時間は 1 ÷ 12 ≒ 83 ミリ秒以下です。
      - 平均待ち時間（処理開始までの時間）の式 ρ ÷（μ － λ）を 0.25 秒以下とした場合の値（μ ≒ 10.9 件／秒、1 ÷ μ ≒ 92 ミリ秒）です。本問の条件は、処理時間も含めた応答時間です。
      - 平均到着間隔（1 ÷ 8 ＝ 0.125 秒）と同じにすればよいと考えた値です。このとき利用率が 1 となり、待ち行列は際限なく伸びます。
      - 応答時間の上限 0.25 秒を、そのまま 1 件の処理時間の上限とした値です。処理時間が 250 ミリ秒では処理能力が 4 件／秒しかなく、到着の 8 件／秒をさばけません。
    know: M/M/1 では、平均応答時間 ＝ 1 ÷（μ － λ）、平均待ち時間 ＝ ρ ÷（μ － λ）で、利用率 ρ が 1 に近づくと急増する。キャパシティプランニングでは、応答時間の要件から必要な処理性能（サービス率）を逆算して見積もる。
    terms:
      - 待ち行列
      - M/M/1
      - キャパシティプランニング
    verify:
      type: value
      value: 1000 / (8 + 1 / 0.25)
      tolerance: 0.5
